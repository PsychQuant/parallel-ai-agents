# R42 的代價：群組裡的 heredoc。這個 step 只印字面 `hi`，正面文法不收 heredoc，保守擋下。逐字取自 R41 requirements lens 的
# c11/t17-heredoc-in-group。
# LINT-ARGS: --strict
# EXPECT: rule-red
# EXPECT-MSG: 不在 `--strict` 的正面文法裡
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: t17-heredoc-in-group
        shell: bash
        run: |
          set -o pipefail
          {
          cat <<EOF
          hi
          EOF
          } 2>&1 | python3 scripts/neutralise.py
