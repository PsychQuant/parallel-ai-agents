# R38 第 4 列：`>&$"2"` 是 `>&2`（`$"…"` 沒有訊息目錄時就是雙引號字串）；前一版讀成 `>&$2`、看不出目標。
# EXPECT: rule-red
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: dup to fd 2 spelled with a locale string
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$PR_TITLE" >&$"2" 2>&1 | python3 scripts/neutralise.py
