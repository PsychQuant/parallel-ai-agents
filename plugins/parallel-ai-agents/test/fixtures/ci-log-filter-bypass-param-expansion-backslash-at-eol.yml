# R33 opsweep（`${…}` 內兩處 `j + 1 < n` 邊界守衛）：反斜線是行的最後一個字元時沒有下一格可吃——
# bash 對未收尾的 `${` 報語法錯誤；本 lint 吃到行尾、無管線 → 紅。守衛拿掉會越界當掉。
# **R34 起判 parse-red**（#33 verify R34 logic F1／F3）：同一行沒收尾的 `${…}`／`$'…'` 在 bash 可以跨行，
# 本 lint 的狀態表示不了 ⇒ fail-closed `PARSE:`，不再「吃到行尾、下一行重新掃」——那正是跨行繞過的來源
#（`bypass-param-expansion-multiline`、`bypass-ansic-quote-multiline`）。這一檔仍然是紅，理由改成誠實的那一個。
# EXPECT: parse-red
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: backslash at end of line inside double quotes within an expansion
        run: |
          echo ${PR_TITLE#"a\
      - name: backslash at end of line unquoted within an expansion
        run: |
          echo ${PR_TITLE#a\
      - name: compliant control
        run: echo hi | python3 scripts/neutralise.py
