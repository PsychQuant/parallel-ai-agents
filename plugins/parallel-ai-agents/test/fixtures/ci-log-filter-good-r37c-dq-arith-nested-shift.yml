# #33 verify R37 相鄰輸入（R36 沒點名）：雙引號算術裡有巢狀括號、左移的右運算元是變數名。380e4a4 同第 16 列：
# `<<` 被登記成 heredoc（終止字 `attempt`）、下一行的過濾管線被吃掉 ⇒ RULE 誤擋。bash 5.3 實跑接到 neutralise。
# （野外語料的 `"$((60 * (1 << (run_attempt - 1)) + …))"` 在 380e4a4 碰巧沒事：`<<` 後面緊接 `(`，分隔字詞是空的、
# 不登記 heredoc——右運算元換成名字就翻。）
# EXPECT: pass
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: dq-arith-nested-shift
        run: |
          delay="$(( (1 << attempt) * 60 ))"
          echo "$delay" 2>&1 | python3 scripts/neutralise.py
