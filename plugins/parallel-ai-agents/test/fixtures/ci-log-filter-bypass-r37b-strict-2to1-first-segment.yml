# #33 verify R36 第 3 列 → R37：`--strict` 的 `2>&1` 規則改成逐條管線、每一段都要涵蓋（前一版比兩條正規式的總數）。
# 前段的 stderr：`cat` 的錯誤訊息帶著 PR 文字直接進 log，最後一段帶了 `2>&1` 也救不到（R36 點名）。
# R37 移植 #61 群組規則後：上面說的逐段 `2>&1` 規則已由群組規則取代——這個區塊不是 `{ …; } 2>&1 | python3 …` 群組，現在由群組規則擋。
# LINT-ARGS: --strict
# EXPECT: rule-red
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: first segment stderr
        shell: bash
        run: |
          cat "$PR_TITLE" | grep x 2>&1 | python3 scripts/neutralise.py || true
