# #33 R42 WP10：殺 FLAT 靶「重導向目標不查 `..`」。`a/../out.txt` 其實就是 `out.txt`，不外流；但含 `..` 的相對路徑夠多層
# 就走得到 /dev、/proc（lint 不知道工作目錄有多深），正面文法一律不收——保守擋下。
# LINT-ARGS: --strict
# R42：這一步是**文法外**——不在正面文法裡、神諭實跑沒有外流、pipefail 開著。保守擋下，由下面的宣告簽名。
# KNOWN-CLASS: 文法外
# EXPECT: rule-red
# EXPECT-MSG: 重導向目標 `a/../out.txt` 不在文法裡
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: dotdot target
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          {
            echo "$PR_TITLE" > a/../out.txt
          } 2>&1 | python3 scripts/neutralise.py
