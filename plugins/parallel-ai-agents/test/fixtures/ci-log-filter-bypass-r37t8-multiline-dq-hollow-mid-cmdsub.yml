# t8 R33a（`_rule_lines`：程式碼整行挖空的行也要留著、連同對齊的原文）：跨行雙引號字串的中間行在程式碼裡全是空白，但那一行的 `$(echo "$PR_TITLE" >&2)` 會在外層 `2>&1` 之前展開、寫到 stderr；丟掉整行挖空的行時原文跟著消失、`>&2` 看不到而放行。
# EXPECT: rule-red
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: s
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "line1
          mid $(echo "$PR_TITLE" >&2) x
          end" 2>&1 | python3 scripts/neutralise.py
