# runner 通道字面寫入的逐運算元語料（_fl_chan_line_ok、_fl_env_key_denied、_fl_merge）——被擋的 112 個。每個 step 各自要有自己的 RULE 行（EXPECT-EACH-STEP）；神諭沒有觀察到外流（沒有 PR 文字進去），逐步簽 `KNOWN-CLASS: 文法外`。
# 由 `runner 通道字面寫入的逐運算元語料（_fl_chan_line_ok、_fl_env_key_denied、_fl_merge）` 的候選語料（168 個 step，每個是靠管線過濾的群組形式、各放一個命令）依基準 lint 的逐 step 判定拆成兩張：放行的一張（`good-`，EXPECT: pass）、被擋的一張（`restrict-`，
# EXPECT-EACH-STEP: rule-red）。目的：#33 verify R44 的區域 opsweep（`--since 11e2b8f`）在這個函式的每個運算元上都有存活者——每個運算元沒有各自會翻色的輸入；
# 這份語料按**運算元的邊界**取樣（每個接受／拒絕的分岔各有輸入），不挑已知形狀。
# 簽名比被擋的 step 少一個：第 067 個（`printf "K=%s\n" "$PR_TITLE" >> "$GITHUB_ENV"`）把 PR 文字寫進通道，神諭**觀察到**外流、判一致（擋下是對的），所以不簽 `文法外`。
