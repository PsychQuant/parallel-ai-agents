# #33 verify R36 第 22 列 → R37：`--strict` 的兩個誤擋——`runs-on` 行尾註解裡的 windows、`case … in a|b)` 的模式 `|`。
# R36 點名的兩個，加相鄰輸入：跨行的 case、block 清單形式的 runs-on 帶註解。
# LINT-ARGS: --strict
# EXPECT: pass
name: t
on: pull_request
jobs:
  a:
    runs-on: ubuntu-latest  # windows runners are not supported here
    steps:
      - name: pipeline on a runner whose comment mentions windows
        run: |
          set -o pipefail
          printf 'ok\n' 2>&1 | python3 scripts/neutralise.py
      - name: case alternation is not a pipe
        # LOG-FILTER: none — prints a constant
        run: |
          case "$GITHUB_EVENT_NAME" in push|pull_request) echo ok;; esac
      - name: multi-line case alternation
        # LOG-FILTER: none — prints a constant
        run: |
          case "$GITHUB_EVENT_NAME" in
            push|pull_request)
              echo ok ;;
            *) echo other ;;
          esac
  b:
    runs-on:
      - self-hosted
      - linux  # not windows
    steps:
      - name: block runs-on list with a comment
        run: |
          set -o pipefail
          printf 'ok\n' 2>&1 | python3 scripts/neutralise.py
