# #33 R42 opsweep（_fl_command / _fl_word 的四個複合守衛，killer_finder 找到的可殺缺口，語料不產生這些形狀）：
# 每一步原碼各以一個運算元擋下、突變體拿掉該運算元後放行。EXPECT-EACH-STEP 確保每步都各自紅（不是靠別步）。
# LINT-ARGS: --strict
# R42：這一張的 4 步是**文法外**——不在 `--strict` 的正面文法裡、神諭實跑沒有外流（stdout／stderr／跨 step 通道都沒有）、
# pipefail 探針沒看到關閉。保守擋下，由下面的宣告簽名（神諭的類別閘門是雙向的）。
# KNOWN-CLASS: 文法外
# KNOWN-CLASS: 文法外
# KNOWN-CLASS: 文法外
# KNOWN-CLASS: 文法外
# EXPECT: rule-red
# EXPECT-EACH-STEP: rule-red
# EXPECT-MSG: 指派後面還有東西
# EXPECT-MSG: trap 的動作
# EXPECT-MSG: printf
# EXPECT-MSG: mktemp
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: prefix assignment X=1 cmd
        shell: bash
        run: |
          { X=1 echo hi; } 2>&1 | python3 scripts/neutralise.py
      - name: trap action is a builtin name
        shell: bash
        run: |
          { trap set EXIT; echo hi; } 2>&1 | python3 scripts/neutralise.py
      - name: printf non-literal format
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          { printf "$PR_TITLE" hi; } 2>&1 | python3 scripts/neutralise.py
      - name: mktemp not the whole assignment value
        shell: bash
        run: |
          { X=a=$(mktemp); echo hi; } 2>&1 | python3 scripts/neutralise.py
