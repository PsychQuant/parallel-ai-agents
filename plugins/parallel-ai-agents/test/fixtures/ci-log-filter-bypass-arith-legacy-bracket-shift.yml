# `$[1<<2]` 是舊式算術展開，`<<` 是左移不是 heredoc。R33 版不認 `$[` ⇒ 登記一個終止字為 `2]` 的 heredoc，把 bash 眼中的 code 收成資料（logic F3 t1）。
# 來源（#33 verify R34 logic F1／F3／F4 的探針；DA 的 n 系列是它在 da-work/probes 留下的檔案）
# EXPECT: rule-red
name: t
on: push
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: t1-legacy-arith-shift
        run: |
          echo $[1<<2]
          echo "$PR_TITLE"; cat <<'Z'
          2]
          x| python3 scripts/neutralise.py
          Z
