# #33 verify R36 第 4 列 → R37：GitHub 只對**關鍵字** `shell: bash` 加 `-o pipefail`；自訂樣板照字面跑。前一版把「是 bash」當成「有 pipefail」。
# `/usr/bin/bash -e {0}`：絕對路徑的 bash 樣板同樣沒有 pipefail（相鄰輸入，R36 沒點名）
# R37 移植 #61 群組規則後寫成合規的群組形式：只剩 pipefail 規則會擋它（否則群組規則也紅，拿掉 pipefail 規則這一檔照樣紅）。
# LINT-ARGS: --strict
# EXPECT: rule-red
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: pipe without pipefail
        shell: /usr/bin/bash -e {0}
        run: |
          { false; } 2>&1 | python3 scripts/neutralise.py
