# #33 R42：這兩個 step 原本是 `good-strict-group-forms`（EXPECT: pass）的第 2、4 步。第 2 步是 #60 表格「經過濾」那幾列
# （群組內的展開期與重導向錯誤：`${!PR_TITLE}`、`> "$PR_TITLE/y"`），第 4 步是群組裡的 heredoc、引號與逃脫的大括號、`${…}`、
# 大括號展開、背景 `&` 後接 `}`。正面文法不收 `${!…}`、非字面的重導向目標、未加引號的 `\`、heredoc、單獨的 `&`，保守擋下。
# step 逐字搬過來。
# LINT-ARGS: --strict
# **R44 更正（#33 verify R43）**：第 1 個 step 在 R42 被當成「輸出在群組裡、併進 neutralise.py、所以是揭露的誤擋」。**這個說法是錯的**：
# `${!PR_TITLE}` 是間接展開，bash 把 `PR_TITLE` 的值當**變數名**去查，名字裡的陣列下標（`PWD[$(…)]`）會被當算術求值、命令替換照樣執行——
# 在 bash 3.2、5.2、5.3 都是。命令的副作用不經過 neutralise.py。所以這一步是**真的擋對了**，神諭的注入探針現在也觀察得到（判一致），
# 不再是已知類別。只有第 2 個 step（heredoc、逃脫的大括號、大括號展開、背景 `&`）仍是**文法外**——不在 `--strict` 的正面文法裡、
# 神諭實跑沒有外流（stdout／stderr／跨 step 通道／注入哨兵都沒有）、pipefail 探針沒看到關閉。保守擋下，由下面的宣告簽名
# （神諭的類別閘門是雙向的）。
# KNOWN-CLASS: 文法外
# EXPECT: rule-red
# EXPECT-MSG: 不在 `--strict` 的正面文法裡
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: multi-line group with set prefix, default shell
        run: |
          set -euo pipefail
          {
            echo "${!PR_TITLE}" || true
            echo x > "$PR_TITLE/y" || true
          } 2>&1 | python3 scripts/neutralise.py
      - name: braces that are not reserved words
        shell: bash
        run: |
          {
            echo "{" '}' \} ${PR_TITLE} {a,b}
            cat <<EOF
          }
          EOF
            sleep 0 & } 2>&1 |
            python3 ../pai-lenses/scripts/neutralise.py
