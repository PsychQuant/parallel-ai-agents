# R33 opsweep（`_next_phys` 兩個運算子）：折疊後的佔位（None）不是一行——行尾反斜線的續行要接的是**下一個實體行**，
# 中間的佔位要跳過。PyYAML：`true`／`echo hi \`／`  | python3 …` → `'true echo hi \\\n  | python3 …'`；bash 續行後
# 管線成立。不跳過佔位的版本會把 None 接進字串而當掉——**本檔只守這一點**。
# **它分不出「步長對」與「重掃」**（#33 verify R34 regression H-2 更正）：前一版這裡寫「步長錯的版本接到空字串 → 紅」，
# 而 R33 出貨的版本正是步長錯的（跳過佔位但 `spans` 只加 1），本檔照樣綠——被接上來的行重掃一次、兩次都看得到管線。
# 步長由 `bypass-folded-continuation-blank-rescan` 與 `…-unbalanced-quote-rescan` 守。
# EXPECT: pass
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: line continuation must skip the fold placeholder
        run: >
          true
          echo hi \
            | python3 scripts/neutralise.py
