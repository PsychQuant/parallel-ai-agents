# ——這一檔是**誤改方向**（前一版誤擋一個安全檔，不是讓一個不安全檔漏網），與命名探針的兩重
# heredoc 嫌結構不同：單一 `cat <<'a b '`，接上的行是 `a`、`b `（行尾空白同樣在**第二行**，與命名探針的對應摺行位置相同——兩者的結構差異在於單一 heredoc vs 命名探針的兩重 heredoc，不在行尾空白落在第幾行）。PyYAML 對帳：折成 `a b `，恰好跟分隔字相符 → heredoc 正確收尾、後面的 neutralise 管線真的執行，
# 是安全檔。前一版 `l.strip()` 把 `b ` 剥成 `b`，折出 `a b`（少一個空格）——跟分隔字少一個字元、永遠不相符，
# heredoc 從 lint 的角度吃到檔尾、真正的 neutralise 呼叫被當成 heredoc 資料吞掉，lint 因此看不到任何 neutralise 呼叫，
# 把安全檔判成 RULE：誤擋。bash 5.3 對帳：真的在 `a b ` 那行終止，後面的 `echo x 2>&1 | python3 …` 真的執行。
# EXPECT: pass
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: fold-mid-trailing-space
        shell: bash
        run: >
          cat <<'a b '

          a
          b 

          echo x 2>&1 | python3 scripts/neutralise.py
