# 這裡根層級 `env:` 寫成 flow **序列**（`env: [FOO, BAR]`）——是 flow 形式，但內容不含冒號
# （序列不是 mapping，沒有鍵值對）。
# 原版：`_flow_value(l_)` 是 True，但 `":" in "[FOO, BAR]"` 是 False，`and` 整體 False，
