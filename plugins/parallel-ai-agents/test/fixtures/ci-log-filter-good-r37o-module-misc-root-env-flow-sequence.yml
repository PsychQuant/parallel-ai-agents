# 是不是 mapping、有沒有冒號）都會在這一行被拒絕（PARSE：「根層級的 env 用 flow 形式」），
# `else` 分支被跳過，變成 `parse-red`。與原版的 `pass` 不同，這張 fixture 殺得掉它。
