# 每個新實體行開頭 `cmd_pos` 無條件重設為 True，回到雙引號時若沒有跟著把它收回 False，這個 True
# 會一路帶出雙引號、帶過中間的空白，讓雙引號**之後**、真正是引數位置的 `[[` 被誤判成命令位置的條件式
