# #33 R46（R45 regression 第 4 列）：`good-r42-flat-opsweep-positives` 的一步原本是 `echo Value >> "$GITHUB_ENV"`（放行）。R44 起 `$GITHUB_ENV` 的寫入要有字面的 `NAME=` 鍵，這一步被擋；
# R44 把原 fixture 改成 `echo NAME=Value >> …` 讓它仍然通過、沒有留下被擋的版本。這一張把原寫法留成 restrict（沒有 PR 文字進去、神諭沒有觀察到外流，簽 `文法外`）。
# LINT-ARGS: --strict
# KNOWN-CLASS: 文法外
# EXPECT: rule-red
# EXPECT-MSG: 不在 `--strict` 的正面文法裡
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: an env file line without a key
        shell: bash
        run: |
          {
            echo Value >> "$GITHUB_ENV"
          } 2>&1 | python3 scripts/neutralise.py
