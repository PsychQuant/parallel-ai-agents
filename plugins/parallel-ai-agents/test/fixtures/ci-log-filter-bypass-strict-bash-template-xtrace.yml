# #33 verify R35（`--strict` shell 規則）：`bash -xeuo pipefail {0}` 是 bash，但 `-x` 開了 xtrace——trace 行帶著 PR 文字
# 進 stderr，不經過只接 stdout 的管線。選項裡有 xtrace（`-x…`／`-o xtrace`）⇒ PARSE。
# LINT-ARGS: --strict
# EXPECT: parse-red
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: xtrace inside a combined option
        shell: bash -xeuo pipefail {0}
        run: echo "$PR_TITLE" 2>&1 | python3 scripts/neutralise.py
