# #33 verify R37 opsweep 補件（最終 lint）：殺 drop-operand|parse_command|if t is None or t["k"] == "NL" or end(t):|1。
# `!`／`time` 前綴消耗迴圈（`parse_pipeline` 裡 `while self.word(self.tok(), "!", "time"): self.i += 1`）
# 消耗掉最後一個 `!` 之後，若整份輸入就這樣結束（沒有換行、沒有任何後續 token），`self.tok()` 回傳
# `None`。原版 `parse_command` 第一格 `if t is None or t["k"] == "NL" or end(t): return None` 正確
# 接住這個 `None`，優雅收工——這條 run 沒有任何可執行的命令，`ok=False`（沒有管線）→ RULE
# 「既沒有經 neutralise.py」。
# 拿掉 `t is None` 這個 operand 後，條件變成 `t["k"] == "NL" or end(t)`——`t` 明明是 `None`，
# 卻還是對它取下標 `t["k"]`，直接 `TypeError: 'NoneType' object is not subscriptable`。這個例外
# **不在** `_analyse()` 呼叫處 `except (IndexError, KeyError, ValueError, RecursionError)` 的白名單裡，
# 整支 Python 帶著 traceback 直接崩潰、rc≠0，輸出裡沒有任何 `RULE:`／`PARSE:`／`VACUOUS` 字樣——
# 跟原版的 `RULE:` 判定不同類。
# bash 5.3 實測：`bash -n -c '!'` → `bash: -c: line 1: syntax error: unexpected end of file`——
# 單獨一個 `!` 本來就不是合法 bash（`!` 後面一定要接命令），沒有任何東西會被執行、也不會外流
# 任何文字；原版判 RULE 是對「讀不懂、沒有管線」的殘骸一律 fail-closed，不是誤判有外流。
# EXPECT: rule-red
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: bang prefix with nothing after it, no trailing newline
        run: |
          !
