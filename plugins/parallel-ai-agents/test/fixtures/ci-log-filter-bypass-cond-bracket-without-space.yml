# #33 verify R35（opsweep --since 6cf6864 的存活者）：`[[ … =~ (a]]| python3 … ) ]]`：`a]]` 不是收尾（`]]` 要自成一個詞），假管線仍在條件式裡。殺 `]]` 前必須是空白的那個運算元。
# 預期判定用 bash 實測（oracle 一致／bash -n）。
# EXPECT: rule-red
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: cond-bracket-nospace
        run: |
          echo "$PR_TITLE"
          if [[ "$PR_TITLE" =~ (a]]| python3 scripts/neutralise.py ) ]]; then :; fi
