# #33 verify R37（case 追蹤）：子句命令裡的 `esac` 是 echo 的參數，不收 case。若把任何位置的 `esac` 都當收尾，
# 下一個模式 `b)` 就被當成命令替換的收尾、提早回到雙引號、內層字串的假管線變 code ⇒ 放行。380e4a4 同樣放行
# （內層 `"` 收掉外層）。bash 5.3：x 是 `esac`，沒有管線，最後一行裸印 PR 文字。
# EXPECT: rule-red
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: dq-case-esac-argument
        run: |
          x="$(case a in a) echo esac;; b) echo " 2>&1 | python3 scripts/neutralise.py ";; esac)"
          echo "$PR_TITLE"
