# R38 第 5 列（五條 leg）：群組豁免的論證是「群組裡 fd 1、fd 2 都是管線」，只涵蓋寫到 fd 1／2 的目標。群組跑在子殼層，但 `$$` 仍是
# 外層 shell 的 PID——在 Linux 上 `/proc/$$/fd/1` 就是外層原本的 stdout（step log）。前一版把群組內的所有 fd 命中一起豁免。
# LINT-ARGS: --strict
# EXPECT: rule-red
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: group writes to proc-ppid-fd1
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          {
            echo "$PR_TITLE" > /proc/$PPID/fd/1
            echo "$PR_TITLE"
          } 2>&1 | python3 scripts/neutralise.py
