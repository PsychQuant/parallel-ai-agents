# #33 R42：原名 `good-r40-pf-on-inside-loop`（EXPECT: pass）。R40 釘住迴圈裡的「開」不會讓同一個迴圈的管線變成關的；控制流程的模擬在 R42 刪除。
# 正面文法不收控制流程（`for`），保守擋下：step 不印 PR 文字，是揭露的誤擋。
# run 區塊逐字保留。
# LINT-ARGS: --strict
# EXPECT: rule-red
# EXPECT-MSG: 不在 `--strict` 的正面文法裡
# ── R42 之前的檔頭（當時是 good fixture；描述的是 R42 刪除前的 lint，只留作沿革）──
# #33 verify R40 最終量測：opsweep 在 R40 的 pipefail 控制流程上報存活，R40 的 fixture 只釘住了點名的輸入、沒有釘住機制。
# 迴圈裡的「開」不會讓同一個迴圈的管線變成關的——迴圈規則只看「關」（`not e["on"]` 被拿掉時誤擋）。
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: on inside a loop
        shell: bash
        run: |
          # LOG-FILTER: none — prints no PR text
          for c in a; do
            set -o pipefail
            false | cat
          done
