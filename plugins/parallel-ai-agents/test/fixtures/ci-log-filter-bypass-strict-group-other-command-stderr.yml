# #59（已知類別 G 的 stderr 版本，在 `--strict` 下）：群組前面一行的錯誤訊息帶著 PR 文字走 stderr。
# LINT-ARGS: --strict
# EXPECT: rule-red
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: stderr from a command before the group
        shell: bash
        run: |
          cat "$PR_TITLE" || true
          { echo safe; } 2>&1 | python3 scripts/neutralise.py
