# #33 R42：原名 `good-r39-strict-pipefail-off-then-on`（EXPECT: pass）。R38 第 11 列：群組內先關再開 pipefail，之後的管線都在 pipefail 之下；pipefail 模擬在 R42 刪除。
# 正面文法在群組裡不收 `set`，保守擋下：`false | true` 跑在重新打開的 pipefail 之下，PR 文字經 neutralise.py 過濾，是揭露的誤擋。
# run 區塊逐字保留。
# LINT-ARGS: --strict
# EXPECT: rule-red
# EXPECT-MSG: 不在 `--strict` 的正面文法裡
# ── R42 之前的檔頭（當時是 good fixture；描述的是 R42 刪除前的 lint，只留作沿革）──
# R38 第 11 列（codex 第 7 條，協調者核對）：群組內先關再開 pipefail，之後的管線都在 pipefail 之下。
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: pipefail turned off and back on
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          {
            set +o pipefail
            set -o pipefail
            false | true
            echo "$PR_TITLE"
          } 2>&1 | python3 scripts/neutralise.py
