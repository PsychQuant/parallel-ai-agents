# #33 verify R36 第 16 列（codex 第 7 條）：雙引號裡的 `$((…))` 是算術，`<<` 是左移不是 heredoc。380e4a4 的 `$(` 判斷
# 也命中 `$((`，於是把 `<<` 登記成 heredoc（終止字 `2`），下一行真正的過濾管線被吃成 heredoc 內文 ⇒ RULE 誤擋。
# EXPECT: pass
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: dq-arith-shift
        run: |
          n="$((1 << 2))"
          printf '%s\n' "$n" 2>&1 | python3 scripts/neutralise.py
