# #33 verify R36 第 3 列 → R37：`--strict` 的 `2>&1` 規則改成逐條管線、每一段都要涵蓋（前一版比兩條正規式的總數）。
# 相鄰輸入（R36 沒點名）：最後一段用 `|&`，舊規則也把它算成涵蓋——前段 `cat` 的 stderr 照樣外流。
# LINT-ARGS: --strict
# EXPECT: rule-red
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: first segment stderr before |&
        shell: bash
        run: |
          cat "$PR_TITLE" | grep x |& python3 scripts/neutralise.py
