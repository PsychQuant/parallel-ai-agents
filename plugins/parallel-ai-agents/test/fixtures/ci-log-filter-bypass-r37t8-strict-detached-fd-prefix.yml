# t8 R15a（`_lex`：fd 前綴要緊貼重導向運算子）：`ls "$PR_TITLE" 2 >&1` 的 `2` 是一個引數、`>&1` 是 no-op，stderr 沒有併進管線；把不緊貼的 `2` 也當前綴時 `--strict` 的 `2>&1` 規則被滿足而放行，bash 實測 ls 的錯誤訊息帶著 PR 文字裸印到 stderr。
# EXPECT: rule-red
# LINT-ARGS: --strict
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: s
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          ls "$PR_TITLE" 2 >&1 | python3 scripts/neutralise.py
