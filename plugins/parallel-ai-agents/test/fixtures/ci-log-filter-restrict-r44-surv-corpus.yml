name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: surv 000
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          {
            echo K=v >> "$GITHUB_ENV" 2>/dev/null
          } 2>&1 | python3 scripts/neutralise.py
      - name: surv 001
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          {
            echo K=v >> "$GITHUB_ENV" > out.txt
          } 2>&1 | python3 scripts/neutralise.py
      - name: surv 002
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
