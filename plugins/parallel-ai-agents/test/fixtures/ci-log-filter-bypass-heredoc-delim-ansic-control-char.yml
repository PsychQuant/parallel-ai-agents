# bash 內部的引號跳脫字元、會被重複（讀 EOF 警告實測）。本 lint 不模擬這個內部表示 ⇒ `\c` 與解出 `\x01`／`\x7f` 的一律
# fail-closed PARSE。拿掉這個守衛，`\c` 會被當成認不得的逃脫保留成 `\cA`，終止字憑空變成可比對的字串。
