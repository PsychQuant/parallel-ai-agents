# #33 verify R41 requirements（S-2 機制差分）：**must-fail 探針**。管線只從 stderr 外流（`ls "$PR_TITLE"`、缺 `2>&1`），看起來是 S-2；
# 但補上 `2>&1` 之後 fd 1 與 fd 2 指向同一處，背景的子殼層因此多印一行 baseline 沒有的外流（`ls "$PR_TITLE-2"`）——機制差分
# 禁止多出新的外流行，所以不是 S-2、是繞過。拿掉那個條件（`s2_mechanism` 的 `ml[1] - base_ml[1]`），它就被收成 S-2、這張探針不再
# 以宣告的理由失敗 ⇒ 神諭 rc=1。R40 的神諭 docstring 寫「本機做不出會翻色的 fixture」，這張就是（macOS 實跑）。逐字取自 R41 的 c10/s2-flip。
# ORACLE-MUST-FAIL: 不是 S-2
# EXPECT: pass
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: s2 flip
        run: |
          ( sleep 1; f=$(cat flag 2>/dev/null); if [ -n "$f" ]; then ls "$f"; fi ) &
          { ls "$PR_TITLE" || :; if [ /dev/fd/1 -ef /dev/fd/2 ]; then echo "$PR_TITLE-2" > flag; fi; } | python3 scripts/neutralise.py
          wait
