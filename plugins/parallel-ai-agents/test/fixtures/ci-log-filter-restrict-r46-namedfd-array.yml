# #33 R45 verify（DA，bash 5.3 實測）：具名 fd 重導向 `{NAME}>` 把 fd 號碼指派給 NAME；bash 的剖析器也接受**陣列參照**——`{a["$PR_TITLE"]}>` 的下標被算術求值，標題 `x[$(命令)]` 的命令替換執行；
# `{RUNNER_TEMP[0]}>` 把 `RUNNER_TEMP`（純量的第 0 個元素就是它自己）改成 `10`。R44 只比對 `\{NAME\}`（`fullmatch`），陣列形式因此放行，而 P1 第 8 類寫「具名 fd 不收」是全稱宣稱。
# 現在：詞以 `{` 開頭、以 `}` 結尾又緊接 `<` 或 `>` 一律擋，不比對內容。三個 step 各自要有自己的 RULE 行。
# LINT-ARGS: --strict
# R46：神諭的 primitive 稽核看不到這個檔的 1 個 step 有外流或違規 argv（沒有 PR 文字出現、沒有 builtin 收到文法之外的東西），逐步簽 `KNOWN-CLASS: 文法外`——不是安全證明。
# KNOWN-CLASS: 文法外
# EXPECT: rule-red
# EXPECT-EACH-STEP: rule-red
# EXPECT-MSG: 具名 fd 重導向
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: named fd with an array subscript from the PR title
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          {
            echo hi {a["$PR_TITLE"]}>/dev/null
          } 2>&1 | python3 scripts/neutralise.py
      - name: named fd that rewrites a trusted variable
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          {
            echo hi {RUNNER_TEMP[0]}>/dev/null
          } 2>&1 | python3 scripts/neutralise.py
      - name: named fd with a literal subscript
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          {
            echo hi {a[1]}>out.txt
          } 2>&1 | python3 scripts/neutralise.py
