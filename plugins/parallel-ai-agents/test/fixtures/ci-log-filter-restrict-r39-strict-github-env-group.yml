# R38 第 11 列（regression MEDIUM-4）：安全的寫法，群組規則保守擋下——規則只收**恰好一對**獨立的大括號、群組前只收 `set` 前綴
# （見 `strict_group_violation` 的「為什麼是恰好一個 `{`、一個 `}`」）。揭露在 oracle.py 的 KNOWN_DISAGREE、#60 與 test.yml 的註解；
# GitHub 文件示範的 `{ echo 'X<<EOF'; …; } >> "$GITHUB_ENV"` 放在群組內：巢狀群組。改寫：逐行 `>> "$GITHUB_ENV"`。
# LINT-ARGS: --strict
# EXPECT: rule-red
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [a]
    steps:
      - name: github env group
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          {
            { echo 'X<<EOF'; echo value; echo EOF; } >> "$GITHUB_ENV"
            echo "$PR_TITLE"
          } 2>&1 | python3 scripts/neutralise.py
