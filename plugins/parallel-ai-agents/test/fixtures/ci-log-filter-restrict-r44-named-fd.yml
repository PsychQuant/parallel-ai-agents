# #33 verify R43 第 14 列（security，LOW）：具名 fd 重導向 `{RUNNER_TEMP}>` 會把 runner 可信變數指派成 fd 號碼（`FL_PLAIN_RE` 允許 `{}`，R43 只擋了
# `{GITHUB_ENV}`）。值是小整數，沒有外流，但 `"$RUNNER_TEMP/…"` 的目標與 `$GITHUB_ENV` 值裡的 `$HOME` 不再是文法假設的意思。
# R44 起緊接重導向運算子的 `{NAME}` 一律拒絕。這是**文法外**——保守擋下、神諭實跑沒有外流。
# LINT-ARGS: --strict
# EXPECT: rule-red
# EXPECT-EACH-STEP: rule-red
# EXPECT-MSG: 不在 `--strict` 的正面文法裡
# EXPECT-MSG: 具名 fd
# **R46（#33 verify R45）**：神諭新增 primitive 稽核（PRELUDE 把 `[`／`test`／`printf` 換成記錄實際 argv 的函式、逐命令比對信任變數）之後，這個檔原本簽名的 2 個 step 有 2 個改判「一致」（builtin 真的收到文法之外的 argv／格式，或信任變數被改寫——神諭直接看到了）；仍簽名的 0 個是稽核看不到的（沒有外流、沒有違規 argv）。簽名數照實測對齊。
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: a named fd redirect over a trusted variable
        shell: bash
        run: |
          {
            true {RUNNER_TEMP}>/dev/null
            echo "$RUNNER_TEMP"
          } 2>&1 | python3 scripts/neutralise.py
      - name: a named fd redirect over HOME
        shell: bash
        run: |
          {
            true {HOME}>/dev/null
            echo hi
          } 2>&1 | python3 scripts/neutralise.py
