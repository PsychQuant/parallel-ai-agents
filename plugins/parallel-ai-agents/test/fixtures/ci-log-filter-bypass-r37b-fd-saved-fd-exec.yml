# #33 verify R36 第 8 列 → R37：fd 流向規則按流向判——重導向目標看去引號後的字、任何 fd 複製（`2>&1`／no-op `>&1` 除外）、xtrace 的各種拼法。
# `exec 3>&1` 另存原本的 stdout，之後 `>&3`（R36 點名）
# EXPECT: rule-red
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: stdout diverted around the pipe
        run: |
          exec 3>&1
          printf '%s\n' "$PR_TITLE" >&3 2>&1 | python3 scripts/neutralise.py
