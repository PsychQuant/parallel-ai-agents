# #33 verify R41 第 10 列：把 `$GITHUB_ENV` 當成命令參數讀取（`grep -q … "$GITHUB_ENV"`、`printf '%s\n' … "$GITHUB_ENV"`）不寫入
# 跨 step 通道。正面文法只收 `< "$GITHUB_ENV"` 這一種唯讀形狀，當參數傳給程式一律擋（它分不出程式讀還是寫）。
# 逐字取自 R41 regression lens 的 b3/ghenv-grep-read 與協調者的 c6-printf-ghenv。
# LINT-ARGS: --strict
# R42：這一張的 2 步是**文法外**——不在 `--strict` 的正面文法裡、神諭實跑沒有外流（stdout／stderr／跨 step 通道都沒有）、
# pipefail 探針沒看到關閉。保守擋下，由下面的宣告簽名（神諭的類別閘門是雙向的）。
# KNOWN-CLASS: 文法外
# KNOWN-CLASS: 文法外
# EXPECT: rule-red
# EXPECT-MSG: 不在 `--strict` 的正面文法裡
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: ghenv-grep-read
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          {
            grep -q "^$NAME=" "$GITHUB_ENV" || echo missing
            make | tee log
          } 2>&1 | python3 scripts/neutralise.py
      - name: c6-printf-ghenv
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          {
            printf '%s\n' "$PR_TITLE" "$GITHUB_ENV"
          } 2>&1 | python3 scripts/neutralise.py
