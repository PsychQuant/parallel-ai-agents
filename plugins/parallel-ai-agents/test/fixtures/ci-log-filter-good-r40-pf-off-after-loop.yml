# #33 verify R40 最終量測：opsweep 在 R40 的 pipefail 控制流程上報存活，R40 的 fixture 只釘住了點名的輸入、沒有釘住機制。
# 迴圈**之後**的「關」不在迴圈裡，迴圈裡的管線不受影響（迴圈交集被拿掉時誤擋）。
# LINT-ARGS: --strict
# EXPECT: pass
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: off after a loop
        shell: bash
        run: |
          # LOG-FILTER: none — prints no PR text
          for c in a; do
            false | cat
          done
          set +o pipefail
