# #33 verify R37 opsweep 補件（最終 lint，scanner 群組）：殺三個 `_brace_end` 突變體（同一張 fixture 殺得掉全部三個，
# 因為它們都是 `_brace_end` 那個「找 `${` 對應 `}`」迴圈本身的失效，三種拆法各自讓迴圈忘記在正確位置停：
#   drop-operand|_brace_end|while k < n and d:|2（拿掉 `d`，只剩 `while k < n:`——迴圈忘記在 `}` 收尾時停，
#     一路掃到字串結尾）
#   ==↔!=|_brace_end|if c == "\\":|1（`==` 換 `!=`——反斜線逃脫判反，`\` 不再跳兩格、非反斜線字元反而跳兩格，
#     位置立刻跑掉）
#   ±1→±2|_brace_end|k += 1|1（一般字元前進 2 格不是 1 格，位置同樣跑掉）
# 三者的共同後果一樣：`_brace_end` 回傳的「`${…}` 之後的位置」比正確值大（多吞掉後面的字元），呼叫端
# `_dq_parts` 只在**這一個**位置插入一個 `\0` 骨架標記（`sk.append("\0")`，不管 `_brace_end` 吞了幾格），
# 於是 `${GITHUB_REF}` 後面緊接的字面文字 `/dev/stderr` 被一起吞進同一個 `\0`，不再出現在骨架字串裡。
#
# `_redir_hit`（machine at line ~1870）判斷重導向目標危不危險，靠的正是骨架字串：
#   `if {"dev", "proc"} & set(posixpath.normpath(sk).split("/")): return "…寫到 /dev 或 /proc 底下…"`
# 原版骨架＝`"\0/dev/stderr"`，`split("/")` 含 `"dev"` → 命中、判定為外流、拒絕（RULE 紅）。
# 三個突變體都讓 `_brace_end` 吞過頭、`/dev/stderr` 消失在骨架裡，`_redir_hit` 看不到 `"dev"` → 放行。
#
# bash 5.3.15 實測（`GITHUB_REF` 未設，展開成空字串）：
#   bash -c 'GITHUB_REF=x; echo "hi" > "${GITHUB_REF}/dev/stderr" 2>&1 | cat'
#   印出 `bash: line 1: x/dev/stderr: No such file or directory`（stderr，不經過管線）——
#   即使 `GITHUB_REF` 真的展開成非空字串，寫入的仍是「某相對路徑/dev/stderr」，CI 上 `GITHUB_REF`
#   通常是 `refs/heads/...` 這類含 `/` 的值，該路徑多半也不存在、echo 的內容一樣走進 stderr（`>` 的
#   重導向失敗訊息與 echo 的資料都不經過 `| python3 …neutralise.py`）。此 fixture 已用
#   test/oracle.py 核對（DEBUG trap + PIPESTATUS 量測）：lint=RULE-red、oracle=piped、一致——
#   原版判定與 bash 實測相符，不是 fail-closed 誤擋。
#
# EXPECT: rule-red
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: brace expansion prefix hides a literal /dev/stderr suffix from the skeleton
        shell: bash
        run: |
          echo "$PR_TITLE" > "${GITHUB_REF}/dev/stderr" 2>&1 | python3 scripts/neutralise.py
