# #33 verify R39 第 1 列：`${{ }}` 規則前一版只認點號的 `github.event.`／`github.head_ref`，下面六種同樣由 runner 在 bash 之前
# 代換、同樣能收掉群組，`--strict` 卻放行（未加引號的四種相對 c53ac22 是回歸）。R40：靠管線過濾的 step，run 裡
# 任何**非字面**的運算式一律 RULE。神諭從 R40 起代換運算式（見 oracle.py 的 RUNNER_PAYLOADS），每個 step 都要判「一致」。
# 本張是不加引號的寫法。
# EXPECT: rule-red
# LINT-ARGS: --strict
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: toJSON
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          { echo ${{ toJSON(github.event) }}; } 2>&1 | python3 scripts/neutralise.py
      - name: format
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          { echo ${{ format('{0}', github.event.pull_request.title) }}; } 2>&1 | python3 scripts/neutralise.py
      - name: index
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          { echo ${{ github['event']['pull_request']['title'] }}; } 2>&1 | python3 scripts/neutralise.py
      - name: env
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          { echo ${{ env.PR_TITLE }}; } 2>&1 | python3 scripts/neutralise.py
      - name: steps
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          { echo ${{ steps.t.outputs.title }}; } 2>&1 | python3 scripts/neutralise.py
      - name: upper
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          { echo ${{ GITHUB.EVENT.PULL_REQUEST.TITLE }}; } 2>&1 | python3 scripts/neutralise.py
