# #33 verify R36 第 15 列（logic）：管線後面接 `; [[ -n x` 沒收尾。同一族缺陷，換成 `cond` 這個跨行狀態
# ——`;` 之後是命令位置，`[[` 正確進入條件式模式，只是它從未 `]]` 收尾。
# EXPECT: parse-red
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: unterm-cond
        run: |
          echo "$PR_TITLE"
          echo x 2>&1 | python3 scripts/neutralise.py ; [[ -n x
