# #33 verify R37（R36 協調者 c2 探針；R36 logic HIGH-3 的兩位元組變體）：兩個 `\x` 逃脫湊出 `é` 的
# UTF-8 編碼（`\xc3\xa9`）。`_ansic_decode` 逐個解成兩個 Unicode 碼位串接，bash 是兩個原始位元組
# （剛好也是同一個字的 UTF-8 編碼，但 lint 的字串物件與 bash 的位元組序列不是同一種東西，delim
# 比對必須 fail-closed，不能靠巧合）。bash 5.3 對帳：heredoc 以檔案最後一行單一的 `é` 收尾，
# 中間的 `x 2>&1 | python3 …` 整行被吞成 heredoc 資料，`echo "$PR_TITLE"` 直接洩漏。
# EXPECT: parse-red
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: ansic-hex-multibyte
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$PR_TITLE"
          cat <<$'\xc3\xa9'
          Ã©
          x 2>&1 | python3 scripts/neutralise.py
          é
