# #33 R42 opsweep（flat_filtered 的訊息 `first[1]["raw"] if first[0]=="W" else first[1]`，==↔!= 存活）：靠管線過濾的 step
# 首詞是重導向（非 W 詞元）時走 else 分支用 `first[1]`（op 字串）；突變體翻成 `first[1]["raw"]`，對 R 三元組取 ["raw"] → TypeError。
# 首詞是重導向＝沒有群組的 `{`，本來就該擋。原碼 RULE、突變體在這裡崩（opsweep 記 CRASHED＝殺）。
# LINT-ARGS: --strict
# R42：這一張的 1 步是**文法外**——不在 `--strict` 的正面文法裡、神諭實跑沒有外流（stdout／stderr／跨 step 通道都沒有）、
# pipefail 探針沒看到關閉。保守擋下，由下面的宣告簽名（神諭的類別閘門是雙向的）。
# KNOWN-CLASS: 文法外
# EXPECT: rule-red
# EXPECT-MSG: 不在 `--strict` 的正面文法裡
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: redirect-first, no group
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          > /dev/null 2>&1 | python3 scripts/neutralise.py
