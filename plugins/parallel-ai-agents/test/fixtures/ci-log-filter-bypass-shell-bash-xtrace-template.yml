# `shell: bash -x {0}`：run 本身完全合規，runner 卻開了 xtrace ⇒ trace 行帶著 PR 文字進 stderr。只接受字面 `bash`（#33 verify R34 security S-3、DA n4／n4b 的探針）。
# shell 是 `--strict` 的規則（R35：預設模式一律套用時合成 A 語料 290 個 base-綠檔翻紅；預設模式假設 shell 是 bash）。
# LINT-ARGS: --strict
# EXPECT: parse-red
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: xtrace shell
        shell: bash -x {0}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" 2>&1 | python3 ../pai-lenses/scripts/neutralise.py
