# `shell: sh`（ubuntu 上是 dash）：dash 不認 `$'…'`，後半段變成單引號字串、沒有管線（#33 verify R34 security S-3、DA n4／n4b 的探針）。
# shell 是 `--strict` 的規則（R35：預設模式一律套用時合成 A 語料 290 個 base-綠檔翻紅；預設模式假設 shell 是 bash）。
# LINT-ARGS: --strict
# EXPECT: parse-red
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: sh (dash) has different lexing
        shell: sh
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$PR_TITLE" $'\'' | python3 ../pai-lenses/scripts/neutralise.py '
