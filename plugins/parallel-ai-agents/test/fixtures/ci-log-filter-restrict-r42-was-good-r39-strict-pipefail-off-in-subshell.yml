# #33 R42：原名 `good-r39-strict-pipefail-off-in-subshell`（EXPECT: pass）。R39 釘住 pipefail 範圍模型：已經結束的子殼層裡的 `set +o pipefail` 管不到外面；那套模型在 R42 刪除。
# 正面文法不收子殼層 `( … )`，保守擋下：`false | true` 仍在 pipefail 之下，PR 文字經 neutralise.py 過濾，是揭露的誤擋。
# run 區塊逐字保留。
# LINT-ARGS: --strict
# R42：這一張的 1 步是**文法外**——不在 `--strict` 的正面文法裡、神諭實跑沒有外流（stdout／stderr／跨 step 通道都沒有）、
# pipefail 探針沒看到關閉。保守擋下，由下面的宣告簽名（神諭的類別閘門是雙向的）。
# KNOWN-CLASS: 文法外
# EXPECT: rule-red
# EXPECT-MSG: 不在 `--strict` 的正面文法裡
# ── R42 之前的檔頭（當時是 good fixture；描述的是 R42 刪除前的 lint，只留作沿革）──
# R38 第 11 列（codex 第 7 條，協調者核對）：`( set +o pipefail )` 只作用在已經結束的子殼層，群組內之後的管線仍在 pipefail 之下。
# R37 的 `_pipefail_holds` 讓子殼層裡的「關」一路關到底，誤擋這個寫法。
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: pipefail off only in a finished subshell
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          {
            ( set +o pipefail )
            false | true
            echo "$PR_TITLE"
          } 2>&1 | python3 scripts/neutralise.py
