# #33 verify R40 最終量測：opsweep 在 R40 的 pipefail 控制流程上報存活，R40 的 fixture 只釘住了點名的輸入、沒有釘住機制。
# lastpipe **之後**的設定才不分範圍；之前子殼層裡的「關」仍然管不到外面（`lastpipe_at < i` 被拿掉時誤擋）。
# LINT-ARGS: --strict
# EXPECT: pass
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: subshell off before lastpipe
        shell: bash
        run: |
          # LOG-FILTER: none — prints no PR text
          ( set +o pipefail )
          shopt -s lastpipe
          false | cat
