name: t
on: push
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: t2prime
        run: |
          echo $((1
          <<2 ))
          echo "$PR_TITLE"; cat <<'Z'
          2
          x| python3 scripts/neutralise.py
          Z
