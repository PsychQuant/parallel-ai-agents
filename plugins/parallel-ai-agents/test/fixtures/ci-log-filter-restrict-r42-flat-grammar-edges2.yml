# #33 R42 opsweep（killer_finder 擴充候選找到的三個缺口，語料＋首輪候選都沒抓到）：
# EXPECT-EACH-STEP 確保每步各自紅。twopieces 原碼與突變體都紅但訊息不同，靠 EXPECT-MSG「文法只收 `$NAME`」區分。
# LINT-ARGS: --strict
# EXPECT: rule-red
# EXPECT-EACH-STEP: rule-red
# EXPECT-MSG: 群組的 `}` 之後必須恰好
# EXPECT-MSG: `&&` 後面沒有命令
# EXPECT-MSG: 文法只收 `$NAME`
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: group tail redirects to fd2 not 2to1
        shell: bash
        run: |
          { echo hi; } >&2 | python3 scripts/neutralise.py
      - name: close brace right after an operator
        shell: bash
        run: |
          {
            echo hi &&
          } 2>&1 | python3 scripts/neutralise.py
      - name: mktemp inside a non-assignment word
        shell: bash
        run: |
          {
            X=a=$(mktemp)
            echo hi
          } 2>&1 | python3 scripts/neutralise.py
