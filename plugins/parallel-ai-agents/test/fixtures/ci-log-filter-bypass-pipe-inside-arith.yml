# `$(( 1 | python3 … ))` 裡的 `|` 是位元 OR，不是管線；bash 的 `echo "$PR_TITLE"` 照樣裸印。算術裡的內容不是 code（DA 的 n5）。
# 來源（#33 verify R34 logic F1／F3／F4 的探針；DA 的 n 系列是它在 da-work/probes 留下的檔案）
# EXPECT: rule-red
name: t
on: push
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: arith-or
        run: |
          echo "$PR_TITLE"; : $(( 1 | python3 scripts/neutralise.py ))
