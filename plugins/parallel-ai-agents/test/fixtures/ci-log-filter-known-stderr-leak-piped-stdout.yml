# R32 security S-2：`PIPED_RE` 不要求 `2>&1`。這一行**有**一條接 neutralise.py 的管線，但 PR 文字走
# stderr、根本沒進管線——bash 實跑：neutralise 被呼叫（piped）而 marker 出現在 stderr（leaked）。
# lint 放行（rc=0）。這是一個**已知的真繞過**，記在 `oracle.py` 的 `KNOWN_DISAGREE`：儀器從 R33 起看得見它，
# 規則與它的網（149 個 fixture 與 shellgen 模板的 `2>&1`）留 R34。EXPECT 寫 pass 是**記錄 lint 現況**，
# 不是說這樣寫是對的——把它改成 rule-red 的那一天，這條 KNOWN_DISAGREE 會因為「變成一致」而 rc=1 逼人重判。
# EXPECT: pass
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: stderr leaks past a stdout-only pipeline
        run: echo "$PR_TITLE" >&2 | python3 scripts/neutralise.py
