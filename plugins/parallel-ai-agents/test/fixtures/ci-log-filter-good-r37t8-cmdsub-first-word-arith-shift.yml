# t8 N18（`$(` 開啟時 cmd_pos 設為 True）：命令替換裡第一個詞的 `((` 是算術命令，`<<` 是左移；不當命令位置時 `((` 退成兩個括號、`<<2` 被登記成 heredoc，下一行的真管線被吞成誤擋。
# EXPECT: pass
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: s
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          x=$( (( 1<<2 )) && echo y )
          echo "$PR_TITLE" 2>&1 | python3 scripts/neutralise.py
