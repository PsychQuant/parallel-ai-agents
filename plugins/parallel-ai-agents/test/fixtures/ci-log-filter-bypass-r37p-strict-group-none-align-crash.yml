# #33 verify R37 opsweep 補件（最終 lint）：殺一個 wave3-strict 存活突變體：
#   drop-operand|strict_group_violation|if not all(src[i] is not None and src[i][a:b] == code[i][a:b] for i, a, b in spans):|1
#
# `strict_group_violation` 的最後一關（字面檢查）對群組外每個要驗證的區段 `(i, a, b)` 都要求
# 兩件事同時成立：`src[i] is not None`（這一行的原文有對齊得上）**且** `src[i][a:b] ==
# code[i][a:b]`（對齊得上的那一段逐字相符）。原版短路在 `src[i] is not None` 上：對齊不上
# 的行直接判失敗（fail-closed，不猜），不會去索引 `None[a:b]`。
#
# 本 fixture 的群組開頭行是 `{ cat 2>/dev/null <<a\`b`——heredoc 分隔字詞裡有一個沒收尾的
# 反引號。`_aligned_sources()` 對這一行的處理：在第一個 `<<` 就切到 heredoc 分支，呼叫
# `_skip_delim_word` 去找分隔字詞的收尾位置；分隔字詞裡的反引號沒有配對，回傳的結尾位置
# 落在「找不到」那一支（`e is None or e > len(s)`），使得這一行整體判 `ok=False`——`src[0]`
# 因此是 `None`。已用抽出的同一份原始碼直接呼叫驗證：
#   shell_scan(["{ cat 2>/dev/null <<a`b", "plain data", "a`b", "} 2>&1 | python3 …"])
#     → run_code = ["{ cat 2>/dev/null <<", "", "", "} 2>&1 | python3 …"]，unparsed=None
#   _aligned_sources(run_code, 同樣四行) → [None, "", "", "} 2>&1 | python3 …"]
#   strict_group_violation(logical, run_code, 上面這份 aligned) 原版回一則違規字串
#     （「群組外的 `set` 前綴、`{` 之前、`}` 之後必須是字面文字……」）——`opener` 那一行
#     （index 0）的 `src[0]` 是 `None`，字面檢查正確判失敗，回一則違規字串，整份判定
#     RULE-red。
#
# 拿掉 `src[i] is not None` 這個運算元後，條件只剩 `src[i][a:b] == code[i][a:b]`，對
# `i=0`（`opener` 那一行）直接對 `None` 做切片 `None[0:2]`——`TypeError: 'NoneType' object
# is not subscriptable`。這個例外**沒有**被本檔案唯一那段 `except (IndexError, KeyError,
# ValueError, RecursionError)` 攔下（`TypeError` 不在那個 tuple 裡），整支 `python3 -`
# 腳本未捕捉例外中止：不印 `RULE:`／`PARSE:`，`mutcheck.py` 的 `verdict()` 回
# `"rc=%d"`，不等於宣告的 `rule-red`。已用抽出的同一份原始碼、套用這顆突變體後直接呼叫
# `strict_group_violation(...)` 驗證：拋出 `TypeError: 'NoneType' object is not
# subscriptable`。
#
# bash 5.3 實測：這個群組開頭寫法本身不是合法 bash——`bash -n` 對
# `{ cat 2>/dev/null <<a\`b` ⏎ `plain data` ⏎ `a\`b` ⏎ `} 2>&1 | cat -A` 回 rc=2
# （`syntax error: unexpected end of file from '{' command`，並先印一則 heredoc
# 「delimited by end-of-file」警告）；bash 對這一段反引號的實際解讀方式與本 lint 的
# `_aligned_sources` 模型不同（bash 把未收尾的反引號當成跨行的命令替換一路吃到檔尾，
# 導致 `}`／管線尾段都被吞進 heredoc 內容、永遠等不到收尾），與本 lint 認為「heredoc 在
# `plain data`／`a\`b` 兩行後結束、`}` 正常收尾」不是同一個語法解讀。**這是 fail-closed、
# 無外流的一例**：這段 run 內容本身在真實 bash 下是語法錯誤（不會執行、不可能外流任何
# PR 文字），神諭對這個 step 的判定是「一致」（不是「誤擋」）——lint 拒絕一段連 bash 自己
# 都無法執行的輸入，沒有放過任何真正安全的寫法；本檔案要證明的純粹是「字面檢查在
# `src[i] is None` 時要 fail-closed 判失敗，不能索引 `None` 崩潰」這件事本身。
# LINT-ARGS: --strict
# EXPECT: rule-red
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: unterminated backtick in a heredoc delimiter on the group opener line fails closed, not by crashing
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          { cat 2>/dev/null <<a`b
          plain data
          a`b
          } 2>&1 | python3 scripts/neutralise.py
