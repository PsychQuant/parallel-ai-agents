# #33 verify R43 第 10 列（regression）(d)：mktemp 變數被重新指派之後要註銷登記——`tmp=$(mktemp -d)`、`tmp="$PR_TITLE"`、`trap "rm -rf $tmp" EXIT`：雙引號 trap
# 動作在設 trap 時展開，離開時把 PR 文字當程式碼再剖析一次。R43 這條沒有 fixture。這是**文法外**——保守擋下；神諭實跑沒有外流（標記不是程式碼）。
# LINT-ARGS: --strict
# EXPECT: rule-red
# EXPECT-MSG: 不在 `--strict` 的正面文法裡
# EXPECT-MSG: 雙引號 trap 動作裡的
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: mktemp variable reassigned before the trap
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          {
            tmp=$(mktemp -d)
            tmp="$PR_TITLE"
            trap "rm -rf $tmp" EXIT
            make test
          } 2>&1 | python3 scripts/neutralise.py
