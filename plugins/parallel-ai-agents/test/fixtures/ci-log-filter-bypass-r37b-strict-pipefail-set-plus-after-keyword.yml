# #33 verify R36 第 4 列 → R37：GitHub 只對**關鍵字** `shell: bash` 加 `-o pipefail`；自訂樣板照字面跑。前一版把「是 bash」當成「有 pipefail」。
# 關鍵字 `bash` 之後 run 裡 `set +o pipefail` 關掉它（R36 點名）
# R37 移植 #61 群組規則後：這個形狀寫不成群組（群組外只收 `set -e／-u／-o` 前綴），於是 step 宣告 `# LOG-FILTER:`——
# 宣告的 step 不受群組規則約束，pipefail 規則照樣適用，這一檔只剩它會擋。
# LINT-ARGS: --strict
# EXPECT: rule-red
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: pipe without pipefail
        shell: bash
        run: |
          # LOG-FILTER: none — fixture 只測 pipefail 的模擬（宣告的 step 不受群組規則約束）
          set +o pipefail
          false 2>&1 | python3 scripts/neutralise.py
