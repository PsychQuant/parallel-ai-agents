# #33 verify R36 第 8 列 → R37：xtrace 的各種拼法（set 的捆綁選項、shopt -o、非字面參數、經由 env 帶進子行程）。
# 雙引號裡的命令替換開 xtrace：`"$(set -x; …)"` 的 trace 行進原始 stderr（子殼層裡的 `set -x` 只管它自己，但它自己就印了 PR 文字）（相鄰輸入，R36 沒點名）
# EXPECT: rule-red
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: xtrace on a pipe-filtered step
        run: |
          v="$(set -x; printf '%s' "$PR_TITLE")"
          printf '%s\n' "$v" 2>&1 | python3 scripts/neutralise.py
