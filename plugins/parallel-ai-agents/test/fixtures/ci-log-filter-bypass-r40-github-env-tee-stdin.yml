# #33 verify R39 第 9 列：寫進 `$GITHUB_ENV`／`$GITHUB_PATH` 的東西，之後**每一個 step** 都會讀進來——PR 文字用 runner 的多行語法
# （`PYTHONIOENCODING<<EOF` ⏎ `x` ⏎ `##[error]…` ⏎ `EOF`）就能設定任意變數；`PYTHONIOENCODING` 的值原樣（含換行）印到每個過濾 step 右端
# python3 的 stderr（bash 5.3 實跑，行首的 `##[error]` 是 workflow command）。這是 GitHub 安全文件警告的環境變數注入。
# R40：靠管線過濾的 step，把**看不出是字面**的內容寫進這兩個檔就擋。
# 本張：`… | tee -a "$GITHUB_ENV"`——tee 的參數都是字面，寫進去的內容來自 stdin（管線的後段）。
# LINT-ARGS: --strict
# EXPECT: rule-red
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: github-env-tee-stdin
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -o pipefail
          {
            printf 'NOTE=%s\n' "$PR_BODY" | tee -a "$GITHUB_ENV" > /dev/null
          } 2>&1 | python3 scripts/neutralise.py
