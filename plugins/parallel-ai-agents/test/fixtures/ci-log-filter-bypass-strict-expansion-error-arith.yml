# #60 第 2 類：算術展開的錯誤訊息含 PR 文字，也是展開期、在 `2>&1` 之前。
# （`$(( PR_TITLE ))` 對神諭的標記值不報錯——識別字未設定就是 0；`1 $PR_TITLE` 對任何非數字值都是語法錯誤。）
# LINT-ARGS: --strict
# EXPECT: rule-red
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: arithmetic expansion error before 2>&1 applies
        shell: bash
        run: |
          echo $(( 1 $PR_TITLE )) 2>&1 | python3 scripts/neutralise.py
