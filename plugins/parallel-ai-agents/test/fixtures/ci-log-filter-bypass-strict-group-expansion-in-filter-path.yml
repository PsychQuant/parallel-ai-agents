# 字面檢查（`}` 之後）：`python3 ${PR_TITLE}neutralise.py` 挖空後路徑是 `neutralise.py`，bash 卻把 PR 文字接進路徑——
# 真的 python3 的「can't open file '<路徑>'」帶著它印到 stderr（那是 python3 自己的 stderr，不在任何 `2>&1` 裡）。
# 神諭的 python3 是 stub、不報這個錯，所以它量不到外流：記在 oracle.py 的 KNOWN_DISAGREE。
# LINT-ARGS: --strict
# EXPECT: rule-red
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: expansion in the filter path
        shell: bash
        run: |
          { echo safe; } 2>&1 | python3 ${PR_TITLE}neutralise.py
