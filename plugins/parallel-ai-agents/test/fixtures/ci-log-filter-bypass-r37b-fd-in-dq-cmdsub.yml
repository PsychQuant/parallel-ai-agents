# #33 verify R36 第 8 列 → R37：fd 流向規則按流向判——重導向目標看去引號後的字、任何 fd 複製（`2>&1`／no-op `>&1` 除外）、xtrace 的各種拼法。
# 雙引號裡的命令替換 `"…$(cmd >&2)"`：掃描器用 `_hidden_subs()` 特別剖析雙引號內命令替換的內容，規則看得到裡面的重導向（這正是 R37 修的地方）——命令替換的 stdout 被帶到原始 stderr（相鄰輸入，R36 沒點名）
# EXPECT: rule-red
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: stdout diverted around the pipe
        run: |
          printf '%s\n' "got: $(printf '%s\n' "$PR_TITLE" >&2)" 2>&1 | python3 scripts/neutralise.py
