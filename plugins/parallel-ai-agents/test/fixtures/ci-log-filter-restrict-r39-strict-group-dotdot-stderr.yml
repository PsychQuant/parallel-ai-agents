# R39 opsweep 存活者（`--since c53ac22`）：`_group_safe_target` 的 `".." not in` 運算元。群組內寫 `/dev/fd/../stderr`：`..` 經過 /dev，不給群組豁免（fail-closed）；
# 拿掉那個運算元，normpath 成 `/dev/stderr` 就被豁免。bash 在兩個平台都寫不出去或寫到群組自己的 stderr——保守擋、KNOWN_DISAGREE。
# LINT-ARGS: --strict
# R42：這一張的 1 步是**文法外**——不在 `--strict` 的正面文法裡、神諭實跑沒有外流（stdout／stderr／跨 step 通道都沒有）、
# pipefail 探針沒看到關閉。保守擋下，由下面的宣告簽名（神諭的類別閘門是雙向的）。
# KNOWN-CLASS: 文法外
# EXPECT: rule-red
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: group writes through dotdot
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          {
            echo "$PR_TITLE" > /dev/fd/../stderr
          } 2>&1 | python3 scripts/neutralise.py
