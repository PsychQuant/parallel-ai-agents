# #33 verify R37 opsweep 補件（sh-opts H）：`_Sh.shell_opts` 逐字元掃描裡 `ch in "oO"` 那支消耗
# 選項名的 `i += 1` 改成 `i += 2` 會多跳過一個詞。`bash -o posix -x -c 'true'`：`-o` 吃掉 `posix`
# 當選項名（`posix` 不在 `_TRACE_OPTS`，不觸發 hit，這步正確），外層 `while` 迴圈接著該讀到 `-x`——
# 原版 `i` 剛好指到 `-x`，逐字元掃描碰到 `x` 且 `on=True` ⇒ hit；`i += 2` 會把 `i` 多推一格，
# 整個跳過 `-x`、直接落在 `-c` 上，碰到 `c` 直接 `return`，`-x` 從沒被看到，這個真正的 trace 漏網。
# bash 5.3 實測：`bash -c 'bash -o posix -x -c "echo hi; echo \$-"'` 內層輸出含 `x`，確認
# `-o posix -x -c` 真的會開 trace，不是良性輸入。
# 神諭對帳（R37 移植 #61 時補）：被擋下的那個命令改成真的把 PR 文字印出去（原本印常數、或那一支不會執行），
# 讓 lint 的紅是「一致」而不是「誤擋」；殺掉的突變體逐一重驗仍然殺。
# EXPECT: rule-red
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: s
        run: |
          bash -o posix -x -c 'echo "$PR_TITLE"' | python3 scripts/neutralise.py
