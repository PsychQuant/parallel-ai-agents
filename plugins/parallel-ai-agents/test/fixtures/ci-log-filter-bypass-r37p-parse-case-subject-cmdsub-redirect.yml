# #33 verify R37 opsweep 補件（最終 lint）：殺 `parse_case` 消費 `case` 關鍵字那行的 `±1→±2` 突變體
# （`self.i += 1  # \`case\`` 改成 `self.i += 2`）。
# 原版：吃掉 `case` 之後 `self.i` 指向主詞詞元，`self.tok()["k"] == "W"` 為真，呼叫 `self.subs()` 掃主詞裡的
# 巢狀命令替換——本檔主詞是 `"$(echo "$PR_TITLE" >&2)"`，裡面的 `>&2` 被掃到、登記一個 fd 外流的 hit。
# 突變體：`self.i += 2` 多跳一格，`self.tok()` 落在主詞後面那個 `in` 關鍵字上（`in` 的詞元種類同樣是
# `"W"`，guard 照樣為真）——`self.subs()` 改對 `in` 這個詞呼叫（它沒有巢狀替換，是空操作），真正的主詞
# 詞元的 `subs()` 從未被呼叫，`>&2` 那個 hit 永遠不會被登記。之後 `in` 已被當成「主詞」吃掉、原本的
# `in` 檢查（`self.word(self.tok(), "in")`）落在第一個模式詞上而不成立，但模式本身照常掃描、不受影響。
# 淨效果：突變體漏掉主詞裡的洩漏，整份判定從 `rule-red` 變成 `pass`。
# bash 5.3 實測（真的外流，非 fail-closed）：
#   PR_TITLE=LEAK bash -c 'case x in "$(echo "$PR_TITLE" >&2)") echo ok ;; esac'
#   stdout 空、stderr 印出 `LEAK`——命令替換為了做樣式比對一定會執行，不論最後有沒有配對成功。
# EXPECT: rule-red
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: s
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          case "$(echo "$PR_TITLE" >&2)" in
            *) : ;;
          esac | python3 scripts/neutralise.py
