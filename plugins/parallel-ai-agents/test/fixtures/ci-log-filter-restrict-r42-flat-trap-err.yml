# #33 R42 WP10：殺 FLAT 靶「trap 收任何訊號」。`trap … ERR` 的動作在群組裡執行、輸出經過濾，這一步不外流；但 DEBUG／ERR／
# RETURN 的動作在每一個命令前後跑，能改 pipefail 與選項——正面文法的 trap 只收 EXIT（或 0），保守擋下。
# LINT-ARGS: --strict
# R42：這一步是**文法外**——不在正面文法裡、神諭實跑沒有外流、pipefail 開著。保守擋下，由下面的宣告簽名。
# KNOWN-CLASS: 文法外
# EXPECT: rule-red
# EXPECT-MSG: `trap` 只收 `trap <動作> EXIT`
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: trap err
        shell: bash
        run: |
          set -o pipefail
          {
            trap 'echo trapped' ERR
            echo ok
          } 2>&1 | python3 scripts/neutralise.py
