# #33 verify R37 opsweep 補件：殺 `drop-operand|_dq_parts|if c == "\\" and i + 1 < n and body[i + 1] in
# '$`"\\\n':|3` 存活突變體——拿掉「下一個字元要落在 `$`／反引號／`"`／`\`／換行 這個逃脫集合裡」的判斷，
# 只留 `c == "\\" and i + 1 < n`。於是雙引號內容裡任何反斜線後面接**非特殊字元**（bash 規則：反斜線只逃脫
# 這五種字元，接其他字元時反斜線本身要原樣保留），都會被誤判成一組逃脫、把反斜線吃掉、只留下那個字元。
# 這裡的 body 是 `\2`（反斜線接數字 `2`，不在逃脫集合裡）：
#   - 原版：`\` 不逃脫 `2`，兩個字元各自當字面收下 → `lit == "\\2"`（反斜線＋2，不是數字）。
#   - 突變體：判斷放寬成任何字元都逃脫 → 只收下 `2`、扔掉反斜線 → `lit == "2"`（是數字）。
# 這個字面值餵給 `>&"\2"` 這個 fd 複製重導向：`_redir_hit` 檢查 `tl.isdigit()`——
#   - 原版 `tl=="\\2"` 不是數字，落到最後的一般檔案目標判定（`>&word`，word 不是數字＝把 stdout／stderr
#     一起寫進檔案 word），目標字面 `\2` 不含 `/dev`／`/proc`，判定通過（pass）。
#   - 突變體 `tl=="2"` 是數字、又不是 `"1"`，命中 `return "…複製 fd（stdout 可能被帶到 stderr 或另存的
#     fd）…"`——RULE。
# bash 5.3 實測：`echo hi >&"\2"` 建立一個**名叫** `\2`（反斜線加 2）的檔案，不是複製到 fd 2——證實雙引號
# 裡反斜線接非特殊字元時原樣保留、`>&word` 落到「當檔名」那一支，原版判定正確。
# EXPECT: pass
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          echo hi >&"\2" 2>&1 | python3 scripts/neutralise.py
