# R39（R38 第 4 列的修法）：命令名不是字面時只在參數**像** `set` 的選項才 fail-closed。`-xzf` 含 `z`，不是 `set` 的選項字母，
# 照常放行——否則 `"$TAR" -xzf a.tgz` 這類常見寫法會被一起擋掉。
# EXPECT: pass
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: nonliteral command name with tar-like options
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          TAR=tar
          "$TAR" -xzf a.tgz || true
          echo "$PR_TITLE" 2>&1 | python3 scripts/neutralise.py
