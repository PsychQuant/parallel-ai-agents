# 群組規則的斷詞：`{` 後面接的是 NBSP（U+00A0）不是空白——bash 只認 ASCII 空白與 tab，`{ true` 是一個詞（不存在的命令），
# 群組根本沒開，下一行在過濾之外執行，最後那行 `}` 才是語法錯誤（bash 5.2 實測外流）。lint 若用 Python 的 `\s` 斷詞會讀成 `{`、`true`。
# LINT-ARGS: --strict
# EXPECT: rule-red
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: NBSP after the opening brace
        shell: bash
        run: |
          { true
          echo "$PR_TITLE"
          } 2>&1 | python3 scripts/neutralise.py
