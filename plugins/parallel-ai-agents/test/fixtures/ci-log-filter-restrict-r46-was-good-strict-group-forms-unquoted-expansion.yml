# #33 R46（R45 regression 第 4 列）：`good-strict-group-forms` 的第 4 步原本是 `echo "{" '}' ${PR_TITLE} {a,b}`（放行）。R44 把 `${PR_TITLE}` 改成 `"${PR_TITLE}"` 讓它仍然通過、沒有留下被擋的版本；
# R46 又把 `{a,b}` 拿掉（大括號展開）。這一張把 R44 之前的未加引號 `${PR_TITLE}` 留成 restrict（斷詞與 glob 之前的值進 echo 的 argv，被過濾的管線擋住——神諭沒有觀察到外流，簽 `文法外`）。
# LINT-ARGS: --strict
# KNOWN-CLASS: 文法外
# EXPECT: rule-red
# EXPECT-MSG: 群組裡的展開一律要加雙引號
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: an unquoted expansion next to literal braces
        shell: bash
        run: |
          {
            echo "{" '}' ${PR_TITLE}
          } 2>&1 |
            python3 ../pai-lenses/scripts/neutralise.py
