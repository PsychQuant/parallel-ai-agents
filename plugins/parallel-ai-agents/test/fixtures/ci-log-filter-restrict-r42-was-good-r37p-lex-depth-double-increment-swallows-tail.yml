# #33 R42：原名 `good-r37p-lex-depth-double-increment-swallows-tail`（EXPECT: pass）。R37 用它經 `--strict` 的 pipefail 模擬觀察 `_lex` 對 `$( (true) )` 的括號深度，那套模擬在 R42 刪除。
# 正面文法不收 mktemp 以外的 `$(`，保守擋下：step 只印常數、管線之前 `set -o pipefail` 已經打開，是揭露的誤擋。
# run 區塊逐字保留。
# LINT-ARGS: --strict
# EXPECT: rule-red
# EXPECT-MSG: 不在 `--strict` 的正面文法裡
# ── R42 之前的檔頭（當時是 good fixture；描述的是 R42 刪除前的 lint，只留作沿革）──
# #33 verify R37 opsweep 補件（最終 lint，lex 群）：殺兩個突變體，同一個構造殺得掉：
#   ±1→±2|_lex|depth += 1|1   （`_lex` 遇到裸 `(` 時把區域變數 `depth` 加一，改成加二；裸 `)` 仍只減一）
#   ±1→±2|_lex|depth -= 1|1   （反過來：裸 `(` 仍只加一，裸 `)` 改成減二）
# 兩者對這個只有「一層裸子殼層」的構造效果相同——不管是「開太多」還是「閉太多」，淨結果都是
# `(true)` 這一層結束時 `depth` 沒有準時回到 0，讓真正的外層 `)` 撞上非零的 `depth`。
#
# 構造：`X=$( (true) )` ── 命令替換裡只有**一層**裸子殼層 `(true)`。原版：進 `(` 時 `depth` 0→1；
# `(true)` 自己的 `)` 讓 `depth` 1→0（`not depth` 成立但 `stop` 這時已經不是那一個字元的 `stop`——
# 這裡走的是 `elif op==")" and depth:` 的一般分支，因為早退回傳的判斷式先看，見下）；真正的外層 `)`
# 出現時 `depth==0`，`not depth` 成立，`stop==")" and c==")" and not cased` 一起成立，正確在這裡
# 收尾——命令替換的內容只有 `(true)`，之後緊接的 `set -o pipefail` 與 `echo ok | cat` 都落在**頂層**
# （`sub=False`），`set -o pipefail` 真的把外層 pipefail 打開，`--strict` 對後面的管線判定通過，
# PASS。
#
# 突變體讓 `depth` 每開一層裸括號就加二、每閉一層只減一：`(` 0→2；`(true)` 自己的 `)` 只把它從 2 減到
# 1（不是 0！）。真正的外層 `)` 出現時 `depth==1`（非零），`not depth` 為假，**提早收尾判斷式失敗**，
# 這個 `)` 被當成一般運算子消費（`elif op==")" and depth: depth -= 1` 這時才把 `depth` 從 1 減到
# 0），但迴圈**沒有 return**、繼續往下讀——換行、`set -o pipefail`、`echo ok | cat` 全部被吞進這次
# 遞迴呼叫的 token 序列裡，變成命令替換的 `subs`（`sub=True`）。`set -o pipefail` 因此被誤判成巢狀
# 設定、對外層 pipefail 狀態沒有作用；外層（頂層）再也沒有任何東西能把 pipefail 打開（`shell: bash
# -e {0}` 本身不帶），`echo ok | cat` 這條管線在 `--strict` 下因為「沒有跑在 pipefail 之下」被判紅
# （RULE-red），不等於 `EXPECT` 的 `pass`，KILL。
#
# 第二個突變體（`depth -= 2`）方向相反、終點相同：`(` 仍只加一（0→1），但 `(true)` 自己的 `)` 把
# `depth` 從 1 減到 **-1**（不是 0！）。真正的外層 `)` 出現時 `depth == -1`（非零、`not depth` 為
# 假），一樣提早收尾判斷式失敗，一樣把 `set -o pipefail` 與 `echo ok | cat` 吞進命令替換的 `subs`
# （`sub=True`），一樣讓 `set -o pipefail` 誤判成巢狀設定、對外層 pipefail 沒有作用，RULE-red，KILL。
#
# LOG-FILTER 宣告理由同群組內另兩張姊妹 fixture（`ci-log-filter-bypass-r37p-lex-nested-paren-depth-
# in-cmdsub.yml`／`ci-log-filter-bypass-r37p-lex-depth-decrement-missing-op-guard.yml`）：跳過
# 「有沒有接管線」「fd 流向」「群組規則」三條，只看 pipefail 模擬本身。
#
# bash 5.3 實測：`bash -e {0}` 底下 `X=$( (true) )` 執行完，命令替換的子殼層完全結束，外層什麼都沒有
# 殘留；緊接著頂層的 `set -o pipefail` 是貨真價實的頂層陳述，之後 `echo ok | cat` 確實跑在 pipefail
# 之下——原版判 PASS 與這個事實一致，突變體判紅是錯的方向。
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: t1
        shell: bash -e {0}
        run: |
          # LOG-FILTER: none — fixture 只測 `_lex` 對 `$(…)` 裡巢狀裸括號的 depth 追蹤，不測群組／fd 規則
          X=$( (true) )
          set -o pipefail
          echo ok | cat
