# #33 verify R40 最終量測：opsweep 在 R40 的 pipefail 控制流程上報存活，R40 的 fixture 只釘住了點名的輸入、沒有釘住機制。
# 只有 `shopt -s lastpipe` 讓範圍失效；別的 `shopt -s`（`nullglob`）不影響——子殼層裡的「關」管不到外面。
# 前面那條管線讓子殼層的「關」不是第一個事件（`lastpipe_at` 的 `==` 翻成 `!=` 時，第一個非 lastpipe 事件被當成 lastpipe）。
# LINT-ARGS: --strict
# EXPECT: pass
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: subshell off after an unrelated shopt
        shell: bash
        run: |
          # LOG-FILTER: none — prints no PR text
          true | cat
          shopt -s nullglob
          ( set +o pipefail )
          false | cat
