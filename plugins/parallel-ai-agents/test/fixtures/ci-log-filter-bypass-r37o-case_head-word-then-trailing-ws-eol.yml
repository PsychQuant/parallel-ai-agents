# #33 verify R37 opsweep 補件：殺 `_case_head` 的 drop-operand 突變體（拿掉第三個 while 迴圈的邊界守衛
# `k < n`，`while k < n and line[k] in " \t":` 只剩 `while line[k] in " \t":`）。
# 原版：讀完 `case` 後面那個詞（`w_end`）之後，這個迴圈跳過詞與 `in` 之間的空白。這裡 `run:` 區塊裡的
# 實體行是 `x=$(case foo` 後面接三個空白、行尾沒有其他字元（`n = len(line)`）。原版：讀完 `foo` 後
# `k = w_end` 落在第一個空白上，跳過三個空白後 `k` 剛好等於 `n`，`k < n` 讓迴圈安全停下；接著
# `line.startswith("in", k)` 對行尾（`line[n:]` 是空字串）比對不到，`_case_head` 回 `False`，主掃描器
# fail-closed（`PARSE:`）。
# 突變體拿掉 `k < n` 這道邊界後，迴圈只看 `line[k] in " \t"`：跳過三個空白仍然為真，於是在 `k == n` 時
# 繼續對長度剛好 `n` 的字串取 `line[n]`——直接丟 `IndexError: string index out of range`，整個 lint
# 當掉（非零 rc，訊息裡沒有 `RULE:`／`PARSE:`／`VACUOUS`）——與原版的 parse-red 判定不同，殺得掉。
# bash 5.3 實測：`x=$(case foo` 後面只有空白、命令替換沒收尾，是懸置的語法錯誤；本 fixture 測的是本
# lint 自己的邊界守衛，不依賴這段命令實際執行的語意。
# EXPECT: parse-red
# LINT-ARGS: --strict
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: cmdsub-case-word-then-trailing-whitespace-eol
        shell: bash
        run: |
          x=$(case foo   
          echo "$x" 2>&1 | python3 scripts/neutralise.py
