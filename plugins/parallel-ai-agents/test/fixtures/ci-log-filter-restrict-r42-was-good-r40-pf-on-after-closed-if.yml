# #33 R42：原名 `good-r40-pf-on-after-closed-if`（EXPECT: pass）。R40 釘住 `fi` 之後條件深度歸零（之後的「開」是無條件的）；`ctl` 與條件深度在 R42 刪除。
# 正面文法不收 `set +o`，也不收 `if`，保守擋下：step 不印 PR 文字、`false | cat` 之前 pipefail 已經重新打開，是揭露的誤擋。
# run 區塊逐字保留。
# LINT-ARGS: --strict
# EXPECT: rule-red
# EXPECT-MSG: 不在 `--strict` 的正面文法裡
# ── R42 之前的檔頭（當時是 good fixture；描述的是 R42 刪除前的 lint，只留作沿革）──
# #33 verify R40 最終量測：opsweep 在 R40 的 pipefail 控制流程上報存活，R40 的 fixture 只釘住了點名的輸入、沒有釘住機制。
# 條件深度在 `fi` 之後要回到 0：之後的「開」是無條件的（`ctl` 的 `cond += 1` 改成 2 時，這一步被當成條件裡的「開」而誤擋）。
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: on after a closed if
        shell: bash
        run: |
          # LOG-FILTER: none — prints no PR text
          set +o pipefail
          if true; then :; fi
          set -o pipefail
          false | cat
