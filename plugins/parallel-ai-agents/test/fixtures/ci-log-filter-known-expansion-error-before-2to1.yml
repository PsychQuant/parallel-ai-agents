# #60 第 2 類（預設模式）：`${!PR_TITLE}` 的展開期錯誤在這一段的 `2>&1` 生效**之前**寫到 stderr——帶了 `2>&1`
# 仍然外流。預設模式量的是詞法、放行它；`--strict`（CI 對真 workflow 用的模式）的群組規則擋下
# （對照 `bypass-strict-expansion-error-indirect`）。R37 的神諭用差分歸類：把這一行換成中性命令，外流跟著消失 ⇒
# 印 PR 文字的是這條管線自己（那一段的展開期錯誤、只走 stderr）⇒ S-2；「已知」的判準是 `--strict` 的群組規則真的
# 擋下這個 step。（PR #61 的神諭按症狀歸 G——它分不出是另一條命令還是同一段的展開。）
# KNOWN-CLASS: S-2
# EXPECT: pass
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: expansion-time error before 2>&1 applies
        run: |
          echo "${!PR_TITLE}" 2>&1 | python3 scripts/neutralise.py
