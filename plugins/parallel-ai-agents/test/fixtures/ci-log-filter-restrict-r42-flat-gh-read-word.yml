# #33 R42 opsweep（`_fl_command` 唯讀豁免的 `not any(FL_GH_RE.search(w["raw"]) …)`）：讀取重導向的目標是 `"$GITHUB_ENV"`，
# 但**參數**也提到它。原碼不給豁免、走 GITHUB_ENV 的產生式（訊息「只准…」）；拿掉那個運算元則給了豁免、改由後面逐詞檢查
# 擋下（訊息「唯讀寫成…」）。兩者都 RULE，只有訊息不同，所以用 EXPECT-MSG 釘住；單步、不與其他步共用這一句訊息。
# LINT-ARGS: --strict
# R42：這一張的 1 步是**文法外**——不在 `--strict` 的正面文法裡、神諭實跑沒有外流（stdout／stderr／跨 step 通道都沒有）、
# pipefail 探針沒看到關閉。保守擋下，由下面的宣告簽名（神諭的類別閘門是雙向的）。
# KNOWN-CLASS: 文法外
# EXPECT: rule-red
# EXPECT-MSG: 雙引號裡只准
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: an argument that mentions GITHUB_ENV beside a read redirect
        shell: bash
        run: |
          {
            grep -q "$GITHUB_ENV" < "$GITHUB_ENV"
          } 2>&1 | python3 scripts/neutralise.py
