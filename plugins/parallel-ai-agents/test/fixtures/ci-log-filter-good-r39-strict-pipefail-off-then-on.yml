# R38 第 11 列（codex 第 7 條，協調者核對）：群組內先關再開 pipefail，之後的管線都在 pipefail 之下。
# LINT-ARGS: --strict
# EXPECT: pass
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: pipefail turned off and back on
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          {
            set +o pipefail
            set -o pipefail
            false | true
            echo "$PR_TITLE"
          } 2>&1 | python3 scripts/neutralise.py
