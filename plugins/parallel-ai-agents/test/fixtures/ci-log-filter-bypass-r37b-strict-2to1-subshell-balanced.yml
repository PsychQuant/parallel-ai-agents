# #33 verify R36 第 3 列 → R37：`--strict` 的 `2>&1` 規則改成逐條管線、每一段都要涵蓋（前一版比兩條正規式的總數）。
# 子殼層湊數：`( … )` 讓舊規則多數到一次、總數打平，第一條管線缺的 `2>&1` 就被蓋掉（R36 點名，DA 的 s2-count）。
# R37 移植 #61 群組規則後：上面說的逐段 `2>&1` 規則已由群組規則取代——這個區塊不是 `{ …; } 2>&1 | python3 …` 群組，現在由群組規則擋。
# LINT-ARGS: --strict
# EXPECT: rule-red
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: count balanced by a subshell
        shell: bash
        run: |
          cat "$PR_TITLE" | python3 scripts/neutralise.py || true
          ( printf 'ok\n' 2>&1 | python3 scripts/neutralise.py)
