# #33 R45 verify：大括號展開的條件是「未加引號的 `{`…`}` 之間有未加引號的逗號或 `..`」。沒有它們，bash 不展開，詞是純字面——文法照收（`echo {NAME}` 本來就放行）；
# 逗號在引號裡也不算；**外部命令**的參數不受這條規則影響（L1：它們本來就不在檢查範圍，`mkdir -p out/{bin,lib}` 是常見寫法）。這張是 `restrict-r46-brace-test-operand` 的負對照：規則只擋會展開的詞，不是所有帶大括號的詞。
# LINT-ARGS: --strict
# EXPECT: pass
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: a single-element brace word is literal
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          {
            echo {NAME} literal
          } 2>&1 | python3 scripts/neutralise.py
      - name: braces inside a word without a comma
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          {
            echo a{b}c
          } 2>&1 | python3 scripts/neutralise.py
      - name: a quoted brace expression
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          {
            echo "{a,b}" '{c,d}'
          } 2>&1 | python3 scripts/neutralise.py
      - name: a quoted comma inside braces
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          {
            echo {a",b"}
          } 2>&1 | python3 scripts/neutralise.py
      - name: a test operand with a quoted brace expression
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          {
            [ -n "{a,b}" ]
          } 2>&1 | python3 scripts/neutralise.py
      - name: an external command with a brace expansion is outside the check
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          {
            mkdir -p out/{bin,lib}
            cp README.md out/README{,.bak}
          } 2>&1 | python3 scripts/neutralise.py
      - name: a comma or a double dot without any brace is just text
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          {
            echo a,b 1..3 x,y..z
          } 2>&1 | python3 scripts/neutralise.py
