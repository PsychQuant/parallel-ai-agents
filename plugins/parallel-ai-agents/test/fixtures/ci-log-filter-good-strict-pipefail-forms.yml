# #33 verify R35（`--strict` 的誤擋守衛）：三種合規形式——step `shell: bash`、job `defaults.run.shell: bash`、run 開頭 `set -euo pipefail`。
# LINT-ARGS: --strict
# EXPECT: pass
name: t
on: pull_request
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - name: step shell bash
        shell: bash
        run: echo hi 2>&1 | python3 scripts/neutralise.py
      - name: set pipefail inline
        run: |
          set -euo pipefail
          { echo hi; echo there; } 2>&1 | python3 scripts/neutralise.py
  b:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: job defaults bash
        run: echo hi |& python3 scripts/neutralise.py
