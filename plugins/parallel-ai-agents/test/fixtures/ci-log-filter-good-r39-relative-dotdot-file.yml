# R39 `..` 規則的對照：一般的相對路徑 `../build.log` 不含 dev／proc，照常放行。
# EXPECT: pass
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: relative dotdot file
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          make > ../build.log 2>&1 || true
          echo "$PR_TITLE" 2>&1 | python3 scripts/neutralise.py
