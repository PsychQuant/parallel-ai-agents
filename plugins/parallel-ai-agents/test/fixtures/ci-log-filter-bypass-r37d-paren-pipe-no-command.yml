# R37 相鄰輸入（不是 R36 點名的那個檔）：同一個「管線左邊沒有命令」缺陷，換一個左邊界字元——不是 R36 探針用的 `;`，
# 是裸 `(`（subshell 開括號後直接是管線，subshell 裡第一段命令是空的，
# 同樣是 bash 語法錯誤）。`PIPED_RE` 新的排除集合 `[^|\s;&(]` 也擋掉這個方向；裸括號本身有配對
# （`(…)` 前後都在），不會另外觸發 `bare_par` 的未收尾判定。
# EXPECT: rule-red
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: paren-pipe-no-command
        run: |
          echo "$PR_TITLE"
          (| python3 scripts/neutralise.py)
