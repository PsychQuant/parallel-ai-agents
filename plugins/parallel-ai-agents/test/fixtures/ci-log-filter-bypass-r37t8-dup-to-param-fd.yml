# t8 R20（`_redir_hit`：`>&$X` 複製到看不出值的 fd 一律算外流）：`X=2` 時 `>&$X` 就是 `>&2`，stdout 在管線之前就改走原本的 stderr，後面的 `2>&1` 也救不回來（重導向由左到右套用）；把非字面的 fd 當成一般檔名目標時骨架不在 /dev 底下而放行（`--strict` 也放行），bash 實測 PR 文字裸印到 stderr。
# EXPECT: rule-red
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: s
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          X=2
          echo "$PR_TITLE" >&$X 2>&1 | python3 scripts/neutralise.py
