# #33 verify R37 opsweep 補件（最終 lint）：殺 drop-operand|parse_command|if len(words) == 1 and not rs and self.op(self.tok(), "(") and self.op(self.tok(1), ")"):|3。
# `f()` 簡寫（不帶 `function` 關鍵字）的偵測發生在一般收詞迴圈裡，每收一個 token 就檢查一次
# 「目前只收了一個字、還沒收過重導向、接下來剛好是空括號」，四個條件 and 起來，這裡拿掉
# 第三個（`self.op(self.tok(), "(")`）。`f >&2 )`：收了字 `f`（`words=["f"]`）後，`self.tok()`
# 是 `>&2`（重導向，不是 `(`）、`self.tok(1)` 剛好是 `)`。原版：四個條件都要成立，第三個不
# 成立，不觸發跳格；迴圈繼續，`>&2` 被當成這個「命令」的下一個 token、`k in ("W","R")` 成立、
# 正常吃進 `rs`、呼叫 `self.redir()`、記一筆 hit；接著碰到孤立的 `)`（OP 型別，不在
# `("W","R")` 裡）迴圈停止。
#
# 拿掉第三個 operand 後，條件只剩 `len(words)==1 and not rs and self.op(self.tok(1), ")")`——
# 完全不檢查當下這格是不是 `(`，只要**下一格**是 `)` 就成立。`>&2` 後面剛好是 `)`，滿足，
# `self.i += 2` 盲目跳過 `>&2` 和 `)` 兩格，`>&2` 永遠沒被 `self.redir()` 看到，直接被當成
# `f()` 簡寫、遞迴呼叫 `parse_command`（此時已經沒有更多 token，回傳 `None`，`kind` 變成
# `"func"`）。
#
# 接了 `true | python3 scripts/neutralise.py` 讓 `ok=True`，逼 lint 走到 fd 檢查那一支。
# bash 5.3 實測：`bash -n -c 'f >&2 )'` → `syntax error near unexpected token ')'`——本來就
# 不是合法語法；原版判 RULE 是對讀不懂的殘骸 fail-closed。
# EXPECT: rule-red
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: bare word, redirect, then a lone close-paren
        run: |
          f >&2 )
          true | python3 scripts/neutralise.py
