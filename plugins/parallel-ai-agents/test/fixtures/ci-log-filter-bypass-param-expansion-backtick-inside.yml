# `${…}` 裡的反引號：bash 把 `` `}` `` 當命令替換，後面的 `| python3 …` 仍在 pattern 裡。R33 版把第一個 `}` 當展開結束 ⇒ 假管線放行（logic F1 p1）。
# 來源（#33 verify R34 logic F1／F3／F4 的探針；DA 的 n 系列是它在 da-work/probes 留下的檔案）
# **R35 起判 rule-red**：`_param_end` 對反引號照 bash 配對（第一版 fail-closed，三軸量到常見寫法 `${X:-$(cmd)}` 因此翻紅）——
# 展開到最後的 `}` 才結束，假管線在展開裡、沒有真管線 ⇒ RULE。
# EXPECT: rule-red
name: t
on: push
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: p1-backtick-in-brace
        run: |
          echo ${PR_TITLE#`}`| python3 scripts/neutralise.py }
