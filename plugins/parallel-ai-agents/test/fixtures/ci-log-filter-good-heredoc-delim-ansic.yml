name: t
on: push
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat <<$'EOF'
          x
          $EOF
          echo "$PR_TITLE"; cat <<'Z'
          EOF
          y| python3 scripts/neutralise.py
          Z
