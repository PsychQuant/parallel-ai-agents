# #33 verify R37 相鄰輸入（作者與 reviewer 都沒點名）：同一個修法也得正確處理
# 「真正空行 → tab 首行」的組合——R36 的探針 tab 行直接是第一行，這檔前面先插一行**真的
# 空白行**（這才是當不能將 tab 混同的真正「空行」）。PyYAML 對帳：第一行空白被跳過，
# 真正的縮排仍然由**第二行**（9sp+tab）決定（pad=9，不是其餘內容行的 10）——證明修法不是
# 「只看第一行」的特例處理，而是 min() 對正確的 body 集合自然成立。前一版把這兩種「空」都排除，
# pad 算成 10，同樣把 tab 行剥空、讓 heredoc 提早收尾。
# EXPECT: rule-red
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: dedent-tab-after-blank
        shell: bash
        run: |

         	
          echo "$PR_TITLE"; cat <<EOF
          EOF
          echo x 2>&1 | python3 scripts/neutralise.py
