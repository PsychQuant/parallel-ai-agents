# `drop-operand|<module>|kind[k] == "SCALAR" and owner[k] == r for k in range(r + 1, s["end"] + 1)):|2`
# ——把「`run:` 的值是跨行引號純量」檢查裡的 `owner[k] == r` 拿掉，變成只剩
