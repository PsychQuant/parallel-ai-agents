# #33 verify R36 第 3 列 → R37：`--strict` 的 `2>&1` 規則改成逐條管線、每一段都要涵蓋（前一版比兩條正規式的總數）。
# `"$X"2>&1`：`2` 黏在前一個詞上，不是 fd——bash 讀成 `>&1`（no-op），stderr 沒有併進管線（R36 點名）。
# LINT-ARGS: --strict
# EXPECT: rule-red
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: 2 glued to the previous word
        shell: bash
        run: |
          cat "$PR_TITLE"2>&1 | python3 scripts/neutralise.py
