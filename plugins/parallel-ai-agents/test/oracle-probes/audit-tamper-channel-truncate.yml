# R48（#33 verify R47 宣稱查核 E 組）：跨 step 通道檔（`GITHUB_ENV` 等）原本放在步驟 cwd 裡，`tee chan-GITHUB_E""NV < /dev/null`（外部命令，`--strict` 放行；加引號拆開名字繞過「提到通道」規則）
# 能把寫進通道的 PR 文字截斷、讓神諭看不到——替身 lint 全放行時判「一致」。**R50 起這一項守的是別的事**：通道檔搬到 `$RUNNER_TEMP/_runner_file_commands/set_env_<uuid>`（runner 自己的介面），cwd 裡的 `chan-GITHUB_ENV` 不是通道——
# 截斷它截斷不到真的通道，寫進 `$GITHUB_ENV` 的 PR 文字仍被看到，替身 lint 全放行時 rc=1、「跨 step 通道」。步驟**可以**截斷真的通道（`tee "$GITHUB_ENV" </dev/null` 判一致，R50 宣稱查核 E 組實測）——
# 那等於清掉那個效果，真的 runner 也一樣，所以不當作失明；見 oracle.py 的 run_script 註解。
# LINT-ARGS: --strict
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          {
            echo "x=$PR_TITLE" >> "$GITHUB_ENV"
            tee chan-GITHUB_E""NV < /dev/null
          } 2>&1 | python3 scripts/neutralise.py
