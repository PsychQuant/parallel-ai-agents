# R46（#33 verify R45 logic 第 5 列）：宣告了 `# LOG-FILTER:` 而沒有觸發（沒有 `|`、沒提到 GITHUB_ENV／GITHUB_PATH）的 step 不進 `--strict` 的正面文法（lint 檔頭 L3）——lint 放行是對的。
# 神諭的 primitive 稽核與注入探針不該把它報成繞過：這個 step 裡有 `[ -v x ]`（argv 在文法的三種形狀之外），替身 lint 全放行時神諭仍必須判一致、rc=0。
# LINT-ARGS: --strict
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # LOG-FILTER: none — the log is not produced by this step
          [ -v PR_TITLE ] && echo set
