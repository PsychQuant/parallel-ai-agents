# 已知盲點類（R50，**文件化，不是保證**）：步驟與儀器在同一個信任域，**步驟能對它所在的 shell 做的事幾乎都能對儀器做**（已經寫進 pipe 的記錄無法撤回）；神諭是 lint 放行步驟的差分測試器，不是 sandbox。限制有兩面：這張探針釘第 (i) 面（步驟或它啟動的程式對儀器做的事）；第 (ii) 面（神諭的 runner 模型與真 runner 不同，如 fd 繼承）見 `oracle.py` 的 `FD_INJECT` 一帶與 `injection-grandchild-closes-fds.yml`。
# 這張探針釘「用編號指到儀器的 fd」（197 注入哨兵、198 事件、199 稽核記錄）這一種。四個 step，各是不同的到達方式（**代表形狀，不是窮舉**）；替身 lint（`lint-pass-all.sh`）全放行，神諭都判「一致」
# （對照：同樣的違規不動 fd 時判「不一致：繞過」，見 `instrument-fd-blind-spots-control.yml`）：
#   cmd-redirect             單一命令的重導向 `printf '%n' Z 199>/dev/null`——那一筆違規記錄寫進 /dev/null（不需要子殼層）
#   save-restore             把 199 存到別的 fd、關掉、違規、再還原
#   close-forge-fin          永久關掉 199，但先留一個指向同一條 pipe 的 fd，事後用它補寫假的 `fin`——永久關掉不還原也不一定判量不到
#   forge-dev-fd             經 `/dev/fd/199`（這條 pipe 在檔案系統裡**有路徑**；macOS 實測；Linux 由 CI 的 selfcheck 驗，ubuntu job 通過這張探針）寫一筆偽造記錄「名稱 x、欄位數 4」，吞掉其後那筆違規記錄的四個欄位——記錄的欄位數沒有被獨立核對
#   （close-injection-stream：`exec 197>/dev/null` 關掉注入哨兵的 fd——R52 前是第五個盲點；R52 起注入哨兵另外走 payload 裡的私有字面路徑，這一步被抓到、不再是盲點，搬到 `injection-sentinel-fd-closed.yml`）
# 其他形狀：不碰 fd 編號的在 `instrument-prelude-known-blind-spots.yml`；事件流、`$ORACLE_PRIV`、逾時在 `instrument-event-and-priv-known-blind-spots.yml`；子殼層關掉在 `audit-fd-closed-in-subshell-known-blind-spot.yml`。
# 真的 `--strict` lint 對這四個 step **的寫法**全部 RULE-red（`N>` 重導向、`>&N` 複製、`set` 前綴之後的第一個詞不是群組的 `{`）；經 fd 寫入的外部命令（`{ echo x | tee /dev/fd/199; …; } 2>&1 | python3 …`、`dd of=/dev/fd/199`、`sh -c 'echo x >&199'`）在文法內被 lint 放行（實測），
# 神諭判『一致』：單獨寫入的垃圾會併進緊接著的子殼層 `fin` 記錄的名稱，主 shell 的 `fin` 完好，所以沒有完整性旗標；外部命令（`sh -c`、`bash -c`）本身就是文法內的任意程式，所以沒有『只有』。盲點危害的是 lint 放行的 step：藏得住的違規本身得先被 lint 放行。神諭的判決是 macOS／bash 5.3.15 的實測；Linux（Ubuntu、bash 5.2.21）由 CI 的 selfcheck 驗——R50 起 ubuntu job 的 selfcheck 通過這些探針（也在 Docker 預跑過）。
# 若有一天補上某一種，這一項會紅；改它時要一併改 README 與 `oracle.py` 的措辭（沒有機制連結，靠人記得）。
# LINT-ARGS: --strict
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: cmd-redirect
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          printf '%n' Z 199>/dev/null
          { echo hi; } 2>&1 | python3 scripts/neutralise.py
      - name: save-restore
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          exec 3>&199
          exec 199>/dev/null
          printf '%n' Z
          exec 199>&3 3>&-
          { echo hi; } 2>&1 | python3 scripts/neutralise.py
      - name: close-forge-fin
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          exec 9>&199
          exec 199>&-
          printf '%n' Z
          printf 'fin\0%d\0%d\0' 1 "$$" >&9
          { echo hi; } 2>&1 | python3 scripts/neutralise.py
      - name: forge-dev-fd
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          printf 'x\0004\0' > /dev/fd/199
          printf '%n' Z
          { echo hi; } 2>&1 | python3 scripts/neutralise.py
