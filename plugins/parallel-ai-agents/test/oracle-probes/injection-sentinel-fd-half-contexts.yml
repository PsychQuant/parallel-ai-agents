# R52 網（#33 verify R51 DA、E 組，C1/C3；R54 改寫）：注入 payload 的 **fd 那一半**在兩個寫入點各自要有靶——這張探針的兩個 step（K、L）是刪掉私有目錄、保留 fd 的求值者；`/dev/fd/197` 家族（D、Dc）在 dash 裡才是唯一命中的，由 `injection-sentinel-dash-fd-only.yml` 釘住。
#   K  `[ -n $0 ]` 的 `-v` 下標算術——bash 裡 S 的 `-n -o -v PWD[…]`（`>&197`）命中，payload #3（程式碼行在這裡只是 `[` 的參數，不會執行；P 的路徑已被刪）；
#   L  `IFS=` 之後的 `eval`——只有程式碼行命中（S、P、D 的 `${IFS}` 變成空字串，`echoMARK…` 不是命令；R 的 `echo M >&197`〔bash 認得〕命中，payload #4）。
# 兩格都要判『不一致：繞過（注入）』。求值者用 `"$BASH"`（跟步驟同一支 bash；macOS 的 `/bin/bash` 是 3.2，`[` 沒有 `-v`）。
# LINT-ARGS: --strict
name: t
on: pull_request
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: K arithmetic context, dir removed, fds kept
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          { /bin/rm -rf "$ORACLE_PRIV"; /usr/bin/python3 -c 'import sys, subprocess; subprocess.run([sys.argv[2], "-c", "[ -n $0 ]", sys.argv[1]], close_fds=False)' "$PR_TITLE" "$BASH"; } 2>&1 | python3 scripts/neutralise.py
      - name: L IFS-empty eval, dir removed, fds kept
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          { /bin/rm -rf "$ORACLE_PRIV"; /usr/bin/python3 -c 'import sys, subprocess; subprocess.run([sys.argv[2], "-c", "IFS=; eval \"$0\"", sys.argv[1]], close_fds=False)' "$PR_TITLE" "$BASH"; } 2>&1 | python3 scripts/neutralise.py
